    }
    function closePeerConn(c, fp) {
      const pc = c.peerConns.get(fp);
      if (pc) { pc.close(); c.peerConns.delete(fp); }
      c.pendingIceCandidates.delete(fp);
      const el = document.getElementById('audio_' + fp); if (el) el.remove();
      for (const [k, v] of remoteVideoTiles) {
        if (v.fp === fp) remoteVideoTiles.delete(k);
      }
      updateVideoTiles();
      detachSpeakingDetector(fp);
    }

    /* ---- indicateur "en train de parler" (comme Discord : contour lumineux autour de l'avatar) ---- */
    const speakingAnalysers = new Map(); // fingerprint -> { analyser, data, stream }
    const speakingState = new Map();     // fingerprint -> bool
    let _speakingLoopId = null;
    function attachSpeakingDetector(fp, stream, force) {
      const audioTracks = stream.getAudioTracks();
      if (!audioTracks.length) return;
      const existing = speakingAnalysers.get(fp);
      if (existing && existing.stream === stream && !force) return;
      if (existing) try { existing.source.disconnect(); } catch (e) { }
      try {
        const ctx = _ac();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.6;
        source.connect(analyser);
        speakingAnalysers.set(fp, { analyser, data: new Uint8Array(analyser.frequencyBinCount), source, stream });
      } catch (e) { }
      ensureSpeakingLoop();
    }
    function detachSpeakingDetector(fp) {
      const existing = speakingAnalysers.get(fp);
      if (existing) { try { existing.source.disconnect(); } catch (e) { } speakingAnalysers.delete(fp); }
      speakingState.delete(fp);
      document.querySelectorAll(`[data-speak-fp="${fp}"]`).forEach(el => el.classList.remove('speaking'));
    }
    function ensureSpeakingLoop() {
      if (_speakingLoopId) return;
      _speakingLoopId = setInterval(() => {
        if (!speakingAnalysers.size) return;
        for (const [fp, entry] of speakingAnalysers) {
          entry.analyser.getByteTimeDomainData(entry.data);
          let sum = 0;
          for (let i = 0; i < entry.data.length; i++) { const d = entry.data[i] - 128; sum += d * d; }
          const rms = Math.sqrt(sum / entry.data.length);
          const isSpeaking = rms > 6; // seuil empirique, au-dessus du bruit de fond du silence numérique
          if (speakingState.get(fp) !== isSpeaking) {
            speakingState.set(fp, isSpeaking);
            document.querySelectorAll(`[data-speak-fp="${fp}"]`).forEach(el => el.classList.toggle('speaking', isSpeaking));
          }
        }
      }, 150);
    }
    function cleanupInactiveTransceivers(fromFp, pc) {
      if (!pc || !pc.getTransceivers) return;
      try {
        for (const tr of pc.getTransceivers()) {
          if (tr.receiver && tr.receiver.track && tr.receiver.track.kind === 'video') {
            const dir = tr.currentDirection || tr.direction;
            if (dir === 'inactive' || dir === 'sendonly') {
              for (const [k, v] of remoteVideoTiles) {
                if (v.fp === fromFp && v.track === tr.receiver.track) {
                  remoteVideoTiles.delete(k);
                  if (v.track) peerTrackTypes.delete(v.track.id);
                }
              }
            }
          }
        }
      } catch (e) { }
      updateVideoTiles();
    }

    function handleVideoStreamInfo(c, fromFp, payload) {
      if (payload.trackId && payload.streamType) {
        peerTrackTypes.set(payload.trackId, payload.streamType);
      }
      const type = payload.streamType || 'camera';
      for (const [k, v] of remoteVideoTiles) {
        if (v.fp === fromFp && v.track && v.track.id === payload.trackId) {
          v.type = type;
          const targetKey = `${fromFp}_${type}`;
          if (k !== targetKey) {
            remoteVideoTiles.delete(k);
            remoteVideoTiles.set(targetKey, v);
          }
        }
      }
      updateVideoTiles();
    }

    function handleVideoStreamStopped(c, fromFp, payload) {
      const type = payload.streamType;
      if (payload.trackId) peerTrackTypes.delete(payload.trackId);
      if (type) {
        remoteVideoTiles.delete(`${fromFp}_${type}`);
      } else {
        remoteVideoTiles.delete(`${fromFp}_camera`);
        remoteVideoTiles.delete(`${fromFp}_screen`);
      }
      for (const [k, v] of remoteVideoTiles) {
        if (v.fp === fromFp && (v.type === type || !type || (payload.trackId && v.track?.id === payload.trackId))) {
          remoteVideoTiles.delete(k);
          if (v.track) peerTrackTypes.delete(v.track.id);
        }
      }
      updateVideoTiles();
    }

    function attachTrackHandlers(c, fp, pc) {
      pc.onicecandidate = (ev) => { if (ev.candidate) sendRelay(c, fp, { kind: 'webrtc-signal', signal: 'ice', candidate: ev.candidate }); };
      pc.ontrack = (ev) => {
        if (ev.track.kind === 'audio') {
          let el = document.getElementById('audio_' + fp);
          if (!el) { el = document.createElement('audio'); el.id = 'audio_' + fp; el.autoplay = true; el.muted = deafened; document.body.appendChild(el); }
          el.srcObject = ev.streams[0];
          attachSpeakingDetector(fp, ev.streams[0]);
        } else if (ev.track.kind === 'video') {
          const stream = ev.streams[0] || new MediaStream([ev.track]);
          const streamType = peerTrackTypes.get(ev.track.id) || (remoteVideoTiles.has(`${fp}_camera`) ? 'screen' : 'camera');
          const tileKey = `${fp}_${streamType}`;
          const username = c.roster.get(fp)?.username || fp;

          remoteVideoTiles.set(tileKey, { stream, username, fp, track: ev.track, type: streamType });

          ev.track.onended = () => {
            remoteVideoTiles.delete(tileKey);
            peerTrackTypes.delete(ev.track.id);
            updateVideoTiles();
          };
          ev.track.onmute = () => {
            setTimeout(() => {
              if (ev.track.muted) {
                remoteVideoTiles.delete(tileKey);
                peerTrackTypes.delete(ev.track.id);
                updateVideoTiles();
              }
            }, 600);
          };
          ev.track.onunmute = () => {
            remoteVideoTiles.set(tileKey, { stream, username, fp, track: ev.track, type: streamType });
            updateVideoTiles();
          };
          updateVideoTiles();
        }
      };
    }
    async function sendWebrtcOffer(c, fp, pc) {
      if (pc.signalingState !== 'stable') return;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendRelay(c, fp, { kind: 'webrtc-signal', signal: 'offer', sdp: pc.localDescription });
    }
    async function flushPendingIceCandidates(c, fp, pc) {
      const candidates = c.pendingIceCandidates.get(fp) || [];
      c.pendingIceCandidates.delete(fp);
      for (const candidate of candidates) {
        try { await pc.addIceCandidate(candidate); } catch (e) { }
      }
    }
    async function ensureVoicePeerConnection(c, fp, iAmOfferer) {
      if (c.peerConns.has(fp)) return c.peerConns.get(fp);
      const pc = new RTCPeerConnection(STUN);
      c.peerConns.set(fp, pc);
      attachTrackHandlers(c, fp, pc);
      const stream = await ensureLocalStream();
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      if (screenStream && screenStream.getVideoTracks()[0]?.readyState === 'live') {
        screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
        sendRelay(c, fp, { kind: 'video-stream-info', streamType: 'screen', trackId: screenStream.getVideoTracks()[0]?.id });
      }
      if (cameraStream && cameraStream.getVideoTracks()[0]?.readyState === 'live') {
        cameraStream.getTracks().forEach(t => pc.addTrack(t, cameraStream));
        sendRelay(c, fp, { kind: 'video-stream-info', streamType: 'camera', trackId: cameraStream.getVideoTracks()[0]?.id });
      }
      if (iAmOfferer) {
        await sendWebrtcOffer(c, fp, pc);
      }
      return pc;
    }
    async function handleWebrtcSignal(c, fromFp, payload) {
      let pc = c.peerConns.get(fromFp);
      if (payload.signal === 'hangup') {
        closePeerConn(c, fromFp);
        c.callState.delete(fromFp);
        soundRingStop(); hideIncomingCallBanner();
        if (activeKey === c.key && activeDmFp === fromFp) renderMain();
        return;
      }
      if (payload.signal === 'video-stream-info') {
        handleVideoStreamInfo(c, fromFp, payload);
        return;
      }
      if (payload.signal === 'video-stream-stopped') {
        handleVideoStreamStopped(c, fromFp, payload);
        return;
      }
      if (payload.signal === 'offer') {
        if (!pc) {
          pc = new RTCPeerConnection(STUN);
          c.peerConns.set(fromFp, pc);
          attachTrackHandlers(c, fromFp, pc);
          const stream = await ensureLocalStream();
          stream.getTracks().forEach(t => pc.addTrack(t, stream));
          if (screenStream && screenStream.getVideoTracks()[0]?.readyState === 'live') {
            screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
            sendRelay(c, fromFp, { kind: 'video-stream-info', streamType: 'screen', trackId: screenStream.getVideoTracks()[0]?.id });
          }
          if (cameraStream && cameraStream.getVideoTracks()[0]?.readyState === 'live') {
            cameraStream.getTracks().forEach(t => pc.addTrack(t, cameraStream));
            sendRelay(c, fromFp, { kind: 'video-stream-info', streamType: 'camera', trackId: cameraStream.getVideoTracks()[0]?.id });
          }
        }
        try {
          await pc.setRemoteDescription(payload.sdp);
          await flushPendingIceCandidates(c, fromFp, pc);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendRelay(c, fromFp, { kind: 'webrtc-signal', signal: 'answer', sdp: pc.localDescription });
          cleanupInactiveTransceivers(fromFp, pc);
          if (activeKey === c.key && activeDmFp === fromFp) renderMain();
        } catch (e) { }
      } else if (payload.signal === 'answer') {
        if (pc) {
          try {
            await pc.setRemoteDescription(payload.sdp);
            await flushPendingIceCandidates(c, fromFp, pc);
            cleanupInactiveTransceivers(fromFp, pc);
          } catch (e) { }
        }
      } else if (payload.signal === 'ice') {
        if (!pc || !pc.remoteDescription) {
          if (!c.pendingIceCandidates.has(fromFp)) c.pendingIceCandidates.set(fromFp, []);
          c.pendingIceCandidates.get(fromFp).push(payload.candidate);
        } else {
          try { await pc.addIceCandidate(payload.candidate); } catch (e) { }
        }
      }
    }
    /* ================= UNE SEULE VOC ACTIVE À LA FOIS (tous serveurs confondus) ================= */
    function findActiveVoiceSession() {
      for (const c of conns.values()) {
        if (c.activeVoiceChannel) return { c, kind: 'channel', id: c.activeVoiceChannel };
        for (const [gid, members] of c.groupVoiceMembers) { if (members.has(CURRENT.fingerprint)) return { c, kind: 'group', id: gid }; }
        for (const [fp, state] of c.callState) { if (state === 'in-call') return { c, kind: 'dm', id: fp }; }
      }
      return null;
    }
    function leaveOtherVoiceSessions(exceptC, exceptKind, exceptId) {
      const active = findActiveVoiceSession();
      if (!active) return;
      if (active.c === exceptC && active.kind === exceptKind && active.id === exceptId) return; // déjà dedans, rien à faire
      if (active.kind === 'channel') leaveVoiceChannel(active.c, active.id);
      else if (active.kind === 'group') leaveGroupVoice(active.c, active.id);
      else if (active.kind === 'dm') endDmCall(active.c, active.id);
    }

    async function joinGroupVoice(c, groupId) { leaveOtherVoiceSessions(c, 'group', groupId); await ensureLocalStream(); c.ws.send(JSON.stringify({ t: 'join-group-voice', groupId })); }
    function leaveGroupVoice(c, groupId) {
      c.ws.send(JSON.stringify({ t: 'leave-group-voice', groupId }));

      if (!findActiveVoiceSession()) { stopCamera(); stopScreenShare(); }
    }
    function reconcileGroupVoicePeers(c, groupId) { const members = c.groupVoiceMembers.get(groupId) || new Set(); if (!members.has(CURRENT.fingerprint)) return; for (const fp of members) if (fp !== CURRENT.fingerprint) ensureVoicePeerConnection(c, fp, CURRENT.fingerprint < fp); }

    /* ---- salons vocaux nommés (comme les salons texte), créés par les owner/admin ---- */
    async function joinVoiceChannel(c, channel) { leaveOtherVoiceSessions(c, 'channel', channel); await ensureLocalStream(); c.ws.send(JSON.stringify({ t: 'join-voice-channel', channel })); }
    function leaveVoiceChannel(c, channel) {
      c.ws.send(JSON.stringify({ t: 'leave-voice-channel', channel }));

      c.activeVoiceChannel = null;
      if (!findActiveVoiceSession()) { stopCamera(); stopScreenShare(); }
    }
    function reconcileVoiceChannelPeers(c, channel) {
      const members = c.voiceChannelMembers.get(channel) || new Set();
      if (!members.has(CURRENT.fingerprint)) return;
      for (const fp of members) { if (fp !== CURRENT.fingerprint && !c.peerConns.has(fp)) ensureVoicePeerConnection(c, fp, CURRENT.fingerprint < fp); }
      for (const fp of [...c.peerConns.keys()]) { if (!members.has(fp)) closePeerConn(c, fp); }
    }
    function startDmCall(c, fp) {

        if (c.callState.get(fp) === 'ringing-out') { cancelDmCall(c, fp); addSystemMessage2DM(c, fp, "Pas de réponse."); }

    function cancelDmCall(c, fp) {

    async function acceptDmCall(c, fp) {

    function showIncomingCallBanner(c, fp, username, avatar) {

    function toggleMicMute() {

    async function stopCamera() {

      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
      } catch (e) {
        window.alert("Impossible d'accéder à la caméra : " + (e.message || e.name));
        return;
      }
      const vidTrack = cameraStream.getVideoTracks()[0];
      if (vidTrack) vidTrack.onended = () => { stopCamera(); };

      for (const c of conns.values()) {
        for (const [fp, pc] of c.peerConns) {
          cameraStream.getTracks().forEach(t => pc.addTrack(t, cameraStream));
          sendRelay(c, fp, { kind: 'video-stream-info', streamType: 'camera', trackId: vidTrack?.id });
          try { await sendWebrtcOffer(c, fp, pc); } catch (e) { }
        }
      }
      updateVideoTiles();
      renderMain();
    }

    async function stopScreenShare() {
      if (!screenStream) return;
      const stoppedTrack = screenStream.getVideoTracks()[0];
      const stoppedTrackId = stoppedTrack?.id;
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;

      for (const c of conns.values()) {
        for (const [fp, pc] of c.peerConns) {
          sendRelay(c, fp, { kind: 'video-stream-stopped', streamType: 'screen', trackId: stoppedTrackId });
          const remainingTrackId = cameraStream?.getVideoTracks()[0]?.id;
          pc.getSenders().filter(s => s.track && s.track.kind === 'video' && s.track.id !== remainingTrackId).forEach(s => {
            try { pc.removeTrack(s); } catch (e) { }
          });
          try { await sendWebrtcOffer(c, fp, pc); } catch (e) { }
        }
      }
      updateVideoTiles();
      renderMain();
    }

    async function toggleScreenShare() {
      if (screenStream) {
        await stopScreenShare();
        return;
      }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      } catch (e) {
        return;
      }
      const scrTrack = screenStream.getVideoTracks()[0];
      if (scrTrack) scrTrack.onended = () => { stopScreenShare(); };

      for (const c of conns.values()) {
        for (const [fp, pc] of c.peerConns) {
          screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
          sendRelay(c, fp, { kind: 'video-stream-info', streamType: 'screen', trackId: scrTrack?.id });
          try { await sendWebrtcOffer(c, fp, pc); } catch (e) { }
        }
      }
      updateVideoTiles();
      renderMain();
    }

    function updateVideoTiles() {
      const grid = document.getElementById('screenGrid');
      if (!grid) return;
      const tilesToKeep = new Set();

      // Mon flux caméra local
      if (cameraStream && cameraStream.getVideoTracks().length && cameraStream.getVideoTracks()[0].readyState === 'live') {
        tilesToKeep.add('tile_local_camera');
        let tile = document.getElementById('tile_local_camera');
        if (!tile) {
          tile = document.createElement('div');
          tile.className = 'screen-tile local-tile';
          tile.id = 'tile_local_camera';
          tile.innerHTML = `<video autoplay playsinline muted></video><div class="label">◉ Moi (Caméra)</div>`;
          grid.appendChild(tile);
        }
        const vid = tile.querySelector('video');
        if (vid.srcObject !== cameraStream) vid.srcObject = cameraStream;
      }

      // Mon partage d'écran local
      if (screenStream && screenStream.getVideoTracks().length && screenStream.getVideoTracks()[0].readyState === 'live') {
        tilesToKeep.add('tile_local_screen');
        let tile = document.getElementById('tile_local_screen');
        if (!tile) {
          tile = document.createElement('div');
          tile.className = 'screen-tile local-tile';
          tile.id = 'tile_local_screen';
          tile.innerHTML = `<video autoplay playsinline muted></video><div class="label">⧉ Moi (Écran)</div>`;
          grid.appendChild(tile);
        }
        const vid = tile.querySelector('video');
        if (vid.srcObject !== screenStream) vid.srcObject = screenStream;
      }

      // Flux vidéo des autres participants
      for (const [key, item] of remoteVideoTiles) {
        if (!item.track || item.track.readyState !== 'live') {
          remoteVideoTiles.delete(key);
          continue;
        }
        const tileId = 'tile_' + key.replace(/[^a-zA-Z0-9_-]/g, '_');
        tilesToKeep.add(tileId);
        let tile = document.getElementById(tileId);
        const labelPrefix = item.type === 'camera' ? '◉ ' : (item.type === 'screen' ? '⧉ ' : '☊ ');
        const labelSuffix = item.type === 'camera' ? ' (Caméra)' : (item.type === 'screen' ? ' (Écran)' : '');
        if (!tile) {
          tile = document.createElement('div');
          tile.className = 'screen-tile remote-tile';
          tile.id = tileId;
          tile.innerHTML = `<video autoplay playsinline></video><div class="label">${labelPrefix} ${escapeHtml(item.username)}${labelSuffix}</div>`;
          grid.appendChild(tile);
        } else {
          const lbl = tile.querySelector('.label');
          if (lbl) lbl.textContent = `${labelPrefix} ${item.username}${labelSuffix}`;
        }
        const vid = tile.querySelector('video');
        if (vid.srcObject !== item.stream) {
          vid.srcObject = item.stream;
          vid.play().catch(() => {});
        }
      }

      for (const el of [...grid.querySelectorAll('.screen-tile')]) {
        if (!tilesToKeep.has(el.id)) el.remove();
      }

      if (tilesToKeep.size > 0) {
        grid.classList.remove('hidden');
      } else {
        grid.classList.add('hidden');
      }
    }
    function renderScreenTile(fp, username, stream) { updateVideoTiles(); }
    function removeScreenTile(fp) { updateVideoTiles(); }

    function getEffectiveRoles(c, fp) {
      if (!c || c.type !== 'channels') return [];
      const rolesList = c.roles || [];
      const roleIds = (c.userRoles && c.userRoles[fp]) || (fp === CURRENT.fingerprint && c.myRoleIds && c.myRoleIds.length ? c.myRoleIds : null) || (c.defaultRoleId ? [c.defaultRoleId] : ['member']);
      const effective = rolesList.filter(r => roleIds.includes(r.id));
      if (effective.length) return effective;
      if (fp === CURRENT.fingerprint && c.myRoles && c.myRoles.length) return c.myRoles;
      return [];
    }

    function userCanViewChannel(c, ch, fp = CURRENT.fingerprint) {
      if (!c || c.type !== 'channels') return true;
      if (c.role === 'owner' || c.role === 'admin') return true;
      const roles = getEffectiveRoles(c, fp);
      if (!roles.length) return true;
      if (roles.some(r => r.permissions && (r.permissions.manageServer || r.permissions.manageRoles || r.permissions.manageChannels))) return true;
      return roles.some(r => {
        if (r.channelPerms && r.channelPerms[ch] && r.channelPerms[ch].view !== undefined) return !!r.channelPerms[ch].view;
        if (!r.permissions) return true;
        if (r.permissions.viewChannels === true || r.permissions.viewChannels === undefined) return true;
        if (Array.isArray(r.permissions.viewChannels)) return r.permissions.viewChannels.includes(ch);
        return false;
      });
    }

    function userCanWriteChannel(c, ch, fp = CURRENT.fingerprint) {
      if (!c || c.type !== 'channels') return true;
      if (c.role === 'owner' || c.role === 'admin') return true;
      const roles = getEffectiveRoles(c, fp);
      if (!roles.length) return true;
      if (roles.some(r => r.permissions && (r.permissions.manageServer || r.permissions.manageRoles || r.permissions.manageChannels))) return true;
      return roles.some(r => {
        if (r.channelPerms && r.channelPerms[ch] && r.channelPerms[ch].write !== undefined) return !!r.channelPerms[ch].write;
        if (!r.permissions) return true;
        if (r.permissions.writeChannels === true || r.permissions.writeChannels === undefined) return true;
        if (Array.isArray(r.permissions.writeChannels)) return r.permissions.writeChannels.includes(ch);
        return false;
      });
    }

    function userCanConnectVoice(c, vch, fp = CURRENT.fingerprint) {
      if (!c || c.type !== 'channels') return true;
      if (c.role === 'owner' || c.role === 'admin') return true;
      const roles = getEffectiveRoles(c, fp);
      if (!roles.length) return true;
      if (roles.some(r => r.permissions && (r.permissions.manageServer || r.permissions.manageRoles || r.permissions.manageChannels))) return true;
      return roles.some(r => {
        if (r.voicePerms && r.voicePerms[vch] && r.voicePerms[vch].connect !== undefined) return !!r.voicePerms[vch].connect;
        if (!r.permissions) return true;
        if (r.permissions.connectVoice === true || r.permissions.connectVoice === undefined) return true;
        if (Array.isArray(r.permissions.connectVoice)) return r.permissions.connectVoice.includes(vch);
        return false;
      });
    }

    function userCanManageRoles(c) {
      if (!c || c.type !== 'channels') return false;
      if (c.role === 'owner' || c.role === 'admin') return true;
      const roles = getEffectiveRoles(c, CURRENT.fingerprint);

    function openMemberMenu(anchorEl, c, fp, member) {
      document.querySelectorAll('.member-menu').forEach(m => m.remove());
      const menu = document.createElement('div'); menu.className = 'member-menu';
      const isOwner = c.role === 'owner';
      const canRoles = userCanManageRoles(c);
      let html = `<button data-a="kick">✕ Expulser (kick)</button><button data-a="ban" class="danger">✕ Bannir</button>`;
      if (isOwner) html += member.role === 'admin' ? `<button data-a="demote">· Rétrograder membre</button>` : `<button data-a="promote">◆ Promouvoir admin</button>`;

        html += `<hr style="border-color:var(--line);margin:4px 0;"><div style="font-size:10px;color:var(--text-dim);padding:4px 8px;text-transform:uppercase;">Attribuer un rôle :</div>`;
        const curRoles = (c.userRoles && c.userRoles[fp]) || [];
        for (const r of c.roles) {
          const has = curRoles.includes(r.id);
          html += `<button data-role-id="${r.id}" data-has="${has ? 1 : 0}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">

    async function ensureGroupKey(c, groupId) {
      if (c.groupRoomKeys.has(groupId)) return c.groupRoomKeys.get(groupId);
      await restoreSavedGroupKey(c, groupId);
      if (c.groupRoomKeys.has(groupId)) {
        if (c.ws && c.ws.readyState === WebSocket.OPEN) c.ws.send(JSON.stringify({ t: 'get-group-history', groupId }));
        return c.groupRoomKeys.get(groupId);
      }
      if (!c.ws || c.ws.readyState !== WebSocket.OPEN) {
        if (c.ws) c.ws.addEventListener('open', () => ensureGroupKey(c, groupId), { once: true });
        return null;
      }
      if (!c._groupKeyReqSent) c._groupKeyReqSent = new Set();
      if (!c._groupKeyReqSent.has(groupId)) {
        c._groupKeyReqSent.add(groupId);
        sendRelayAll(c, { kind: 'key-request', scope: 'group', scopeId: groupId });
      }
      c.ws.send(JSON.stringify({ t: 'get-group-history', groupId }));
      return null;
    }

    function formatMessageContentHtml(rawText, c) {
      if (!rawText) return '';
      const imgRegex = /\[IMG:(data:image\/[a-zA-Z0-9.+_-]+;base64,[A-Za-z0-9+/=]+)\]/g;
      let cleanText = rawText;
      let imgHtml = '';
      const match = imgRegex.exec(rawText);
      if (match) {
        const src = match[1];
        imgHtml = `<div class="msg-img-wrap"><img src="${src}" class="msg-img-attachment" alt="Image" loading="lazy" onclick="openImageLightbox(this.src)"></div>`;
        cleanText = rawText.replace(imgRegex, '').trim();
      }
      if (!cleanText) return imgHtml;
      let textHtml = escapeHtml(cleanText);
      // Code en ligne : `code`
      textHtml = textHtml.replace(/`([^`\n]+?)`/g, '<code>$1</code>');
      // Gras : (**texte**) ou **texte**
      textHtml = textHtml.replace(/\(\*\*([^\*\n]+?)\*\*\)/g, '<b>$1</b>');
      textHtml = textHtml.replace(/\*\*([^\*\n]+?)\*\*/g, '<b>$1</b>');
      // Souligné : (__texte__) ou __texte__
      textHtml = textHtml.replace(/\(__([^_\n]+?)__\)/g, '<u>$1</u>');
      textHtml = textHtml.replace(/__([^_\n]+?)__/g, '<u>$1</u>');
      // Barré : ~~texte~~
      textHtml = textHtml.replace(/~~([^~\n]+?)~~/g, '<s>$1</s>');
      // Italique : *texte*
      textHtml = textHtml.replace(/(^|[^\*])\*([^\*\n]+?)\*([^\*]|$)/g, '$1<em>$2</em>$3');
      // Mentions @user et @everyone
      textHtml = renderMentionsHtml(textHtml, c);
      return imgHtml + `<div class="msg-text-sub">${textHtml}</div>`;
    }

    function triggerImageUpload(c) {
      let input = document.getElementById('chatImageFileInput');
      if (!input) {
        input = document.createElement('input');
        input.type = 'file';
        input.id = 'chatImageFileInput';
        input.accept = 'image/png,image/jpeg,image/webp,image/gif';
        input.style.display = 'none';
        document.body.appendChild(input);
      }
      input.value = '';
      input.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) {
          window.alert("L'image dépasse 15 Mo. Utilise l'option Fichier (SwissTransfer) pour les très gros fichiers.");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1280;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            openImageSendPreviewModal(c, dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

      `;

      if (cancelBtn) cancelBtn.onclick = cancelReply;
    }

    function startReply(m) {
      let snippet = m.text || '';
      snippet = snippet.replace(/\[IMG:[^\]]+\]/g, '📷 Image').trim();
      if (snippet.length > 80) snippet = snippet.slice(0, 80) + '…';
      CURRENT_REPLY = {
        id: m.id || m.tempId,
        author: m.author || '?',
        snippet: snippet || '(média)',
        from: m.from
      };
      updateComposerReplyBar();
      const input = document.getElementById('chatInput');
      if (input) {
        input.focus();
        input.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function cancelReply() {
      CURRENT_REPLY = null;
      updateComposerReplyBar();
    }

    function renderReactionsHtml(m, c) {
      const reactions = m.reactions || {};
      const entries = Object.entries(reactions).filter(([_, fps]) => Array.isArray(fps) && fps.length > 0);
      if (!entries.length && (m.pending || m.failed)) return '';
      let html = '<div class="msg-reactions" data-msg-id="' + escapeHtml(m.id || m.tempId || '') + '">';
      for (const [emoji, fps] of entries) {
        const hasReacted = fps.includes(CURRENT.fingerprint);
        const names = fps.map(fp => {
          if (fp === CURRENT.fingerprint) return 'Toi';
          return c.roster.get(fp)?.username || 'Membre';
        }).join(', ');
        html += `<button class="reaction-pill ${hasReacted ? 'active' : ''}" data-emoji="${escapeHtml(emoji)}" data-msg-id="${escapeHtml(m.id || m.tempId || '')}" title="${escapeHtml(names)}">
          <span class="reaction-emoji">${emoji}</span>
          <span class="reaction-count">${fps.length}</span>
        </button>`;
      }
      if (entries.length > 0 && !m.pending && !m.failed) {
        html += `<button class="reaction-pill reaction-add-btn" data-act="open-reactions" data-msg-id="${escapeHtml(m.id || m.tempId || '')}" title="Ajouter une réaction">
          <span class="reaction-add-plus">＋</span><span class="reaction-add-icon">😀</span>
        </button>`;
      }
      html += '</div>';
      return entries.length > 0 ? html : '';
    }

    function showFloatingToast(msg) {
      let toast = document.getElementById('msgToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'msgToast';
        toast.className = 'floating-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

          closeReactionPicker();
        };
        popover.appendChild(btn);
      });

      const moreBtn = document.createElement('button');
      moreBtn.className = 'more-emojis-btn';
      moreBtn.innerHTML = '＋';
      moreBtn.title = 'Plus d\'émojis';
      moreBtn.onclick = (e) => {
        e.stopPropagation();
        toggleReactionGrid(moreBtn, c, scope, scopeId, msgId, extraEmojis);
      };
      popover.appendChild(moreBtn);

      document.body.appendChild(popover);
      ACTIVE_REACTION_POPUP = popover;

      const rect = anchorBtn.getBoundingClientRect();
      const popRect = popover.getBoundingClientRect();
      let top = rect.top - popRect.height - 8;
      if (top < 10) top = rect.bottom + 8;
      let left = rect.left + (rect.width / 2) - (popRect.width / 2);
      if (left < 10) left = 10;
      if (left + popRect.width > window.innerWidth - 10) left = window.innerWidth - popRect.width - 10;

      popover.style.top = `${top}px`;
      popover.style.left = `${left}px`;
    }

    function toggleReactionGrid(anchorBtn, c, scope, scopeId, msgId, extraEmojis) {
      let grid = document.getElementById('reactionGridPanel');
      if (grid) { grid.remove(); return; }
      grid = document.createElement('div');
      grid.id = 'reactionGridPanel';
      grid.className = 'emoji-grid-panel';

      extraEmojis.forEach(emoji => {
        const b = document.createElement('button');
        b.textContent = emoji;
        b.onclick = (e) => {
          e.stopPropagation();
          toggleMessageReaction(c, scope, scopeId, msgId, emoji);
          closeReactionPicker();
        };
        grid.appendChild(b);
      });

      document.body.appendChild(grid);
      const rect = anchorBtn.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();
      let top = rect.bottom + 6;
      if (top + gridRect.height > window.innerHeight - 10) top = rect.top - gridRect.height - 6;
      let left = rect.right - gridRect.width;
      if (left < 10) left = 10;
      grid.style.top = `${top}px`;
      grid.style.left = `${left}px`;
    }

    // Fermeture automatique au clic extérieur ou touche Échap
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#reactionPickerPopover') && !e.target.closest('#reactionGridPanel')) {
        closeReactionPicker();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeReactionPicker();
      }
    });

    function submitChat() {
      const input = document.getElementById('chatInput');
      let text = input.value.trim();
      if (!text) return;
      const c = conns.get(activeKey);
      if (!c) return;
      if (!activeDmFp && !activeGroupId && !userCanWriteChannel(c, c.activeChannel)) {
        window.alert("⚿ Tu n'as pas la permission d'écrire dans ce salon.");
        return;
      }
      const maxLen = c.maxMessageLength || 5000;
      if (text.length > maxLen) text = text.slice(0, maxLen);
      if (activeDmFp) sendDmMessage(c, activeDmFp, text);
      else if (activeGroupId) sendGroupMessage(c, activeGroupId, text);
      else sendChannelMessage(c, c.activeChannel, text);
      input.value = '';
      cancelReply();
      const counter = document.getElementById('charCounter');
      if (counter) { counter.textContent = `0/${maxLen}`; counter.classList.remove('warn', 'max'); }
    }

    function renderMessages() {
      const c = conns.get(activeKey);
      const view = document.getElementById('messagesView');
      if (!c || !view) return;
      let msgs, lockedHint = null;
      if (activeDmFp) msgs = c.dmThreads.get(activeDmFp) || [];
      else if (activeGroupId) {
        msgs = c.groupMessages.get(activeGroupId) || [];
        if (!c.groupRoomKeys.has(activeGroupId) && (c.groupPendingCipher.get(activeGroupId) || []).length) lockedHint = "⚿ en attente qu'un membre du groupe transmette la clé de déchiffrement...";
      } else {
        msgs = c.messages[c.activeChannel] || [];
        if (!c.roomKeys.has(c.activeChannel) && (c.pendingCipher.get(c.activeChannel) || []).length) lockedHint = "⚿ historique verrouillé — en attente qu'un membre connaissant la clé du salon se reconnecte...";
      }
      const canDeleteAny = !activeDmFp && (!activeGroupId ? (c.role === 'owner' || c.role === 'admin') : (c.groups.get(activeGroupId)?.createdBy === CURRENT.fingerprint));
      const isPersisted = !activeDmFp; // les MP 1-à-1 ne sont pas stockés côté serveur -> pas d'édition/suppression distante
      view.innerHTML = (msgs || []).map((m, idx) => {
        if (m.system) return `<div class="msg system">· ${escapeHtml(m.text)}</div>`;
        if (m.deleted) return `<div class="msg deleted"><div class="avatar">${avatarOrInitials(m.avatar, m.author, 34)}</div><div class="content"><div class="head"><b>${escapeHtml(m.author || '?')}</b></div><div class="body">Message supprimé</div></div></div>`;
        const time = new Date(m.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const mentioned = messageMentionsMe(m.text) && !m.mine;
        const canReact = !m.pending && !m.failed;
        const canReply = !m.pending && !m.failed;
        const canEdit = isPersisted && m.mine && m.id && !m.pending && !m.failed;
        const canDelete = isPersisted && m.id && (m.mine || canDeleteAny) && !m.pending && !m.failed;
        let ticksHtml = '';
        if (m.mine && m.pending) ticksHtml = `<span class="msg-ticks pending" title="Envoi en cours...">·</span>`;
        else if (m.mine && m.failed) ticksHtml = `<span class="msg-ticks failed" title="Non envoyé">✕ non envoyé</span>`;
        else if (isPersisted && m.mine && m.id) {
          const deliveredCount = (m.deliveredTo || []).filter(fp => fp !== CURRENT.fingerprint).length;
          const readCount = (m.readBy || []).filter(fp => fp !== CURRENT.fingerprint).length;
          if (readCount > 0) ticksHtml = `<span class="msg-ticks read" title="Lu">✓✓</span>`;
          else if (deliveredCount > 0) ticksHtml = `<span class="msg-ticks delivered" title="Distribué">✓✓</span>`;
          else ticksHtml = `<span class="msg-ticks sent" title="Envoyé">✓</span>`;
        }
        return `<div class="msg ${mentioned ? 'mentioned' : ''} ${m.pending ? 'pending' : ''} ${m.failed ? 'failed' : ''}" id="msg-${m.id || m.tempId || idx}" data-idx="${idx}" data-msg-id="${escapeHtml(m.id || m.tempId || '')}">
      <div class="avatar" ${!m.mine && m.from ? `data-fp="${m.from}"` : ''}>${avatarOrInitials(m.avatar, m.author, 34)}</div>
      <div class="content">
        ${m.replyTo ? `
          <div class="msg-reply-bar" data-jump-to="${escapeHtml(m.replyTo.id || '')}" title="Aller au message cité">
            <span class="reply-spine-curve"></span>
            <span class="reply-author">@${escapeHtml(m.replyTo.author || '?')}</span>
            <span class="reply-snippet">${escapeHtml(m.replyTo.snippet || '')}</span>
          </div>
        ` : ''}
        <div class="head"><b>${escapeHtml(m.author || '?')}</b><span>${time}${m.editedTs ? '<span class="edited-tag">(modifié)</span>' : ''}</span>${ticksHtml}</div>
        <div class="body">${formatMessageContentHtml(m.text, c)}</div>
        ${renderReactionsHtml(m, c)}
      </div>
      ${(canReact || canReply || canEdit || canDelete) ? `
        <div class="msg-actions">
          ${canReact ? '<button data-act="react" title="Ajouter une réaction">😀</button>' : ''}
          ${canReply ? '<button data-act="reply" title="Répondre">↩</button>' : ''}
          ${canEdit ? '<button data-act="edit" title="Modifier le message">✎</button>' : ''}
          ${canDelete ? '<button data-act="delete" class="danger" title="Supprimer le message">✕</button>' : ''}
        </div>
      ` : ''}
      ${m.failed ? `<div class="msg-actions"><button data-act="retry" title="Réessayer l'envoi">⟳</button><button data-act="dismiss" class="danger" title="Annuler l'envoi">✕</button></div>` : ''}
    </div>`;
      }).join('') + (lockedHint ? `<div class="msg locked">${lockedHint}</div>` : '');
      view.scrollTop = view.scrollHeight;

      view.querySelectorAll('.avatar[data-fp]').forEach(el => el.onclick = () => {
        const fp = el.dataset.fp; const member = c.roster.get(fp);
        openUserProfileMenu(fp, member?.username || '?', member?.avatar || null, member);
      });
      view.querySelectorAll('.mention[data-fp]').forEach(el => el.onclick = () => {
        const fp = el.dataset.fp; const member = c.roster.get(fp);
        openUserProfileMenu(fp, member?.username || '?', member?.avatar || null, member);
      });

      // Clic pour sauter au message cité avec flash lumineux
      view.querySelectorAll('.msg-reply-bar[data-jump-to]').forEach(el => el.onclick = (e) => {
        e.stopPropagation();
        const jumpId = el.dataset.jumpTo;
        if (!jumpId) return;
        const target = view.querySelector(`[data-msg-id="${jumpId}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.remove('msg-highlight-pulse');
          void target.offsetWidth; // trigger reflow
          target.classList.add('msg-highlight-pulse');
          setTimeout(() => target.classList.remove('msg-highlight-pulse'), 2000);
        } else {
          showFloatingToast("Message d'origine introuvable ou trop ancien.");
        }
      });

      // Bouton Répondre
      view.querySelectorAll('.msg-actions [data-act="reply"]').forEach(btn => btn.onclick = (e) => {
        e.stopPropagation();
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        if (m) startReply(m);
      });

      // Bouton Réagir (ouvre le picker de réactions)
      view.querySelectorAll('.msg-actions [data-act="react"], .reaction-add-btn').forEach(btn => btn.onclick = (e) => {
        e.stopPropagation();
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        if (m) openReactionPicker(btn, m, c);
      });

      // Clic sur une pilule de réaction existante pour basculer (toggle)
      view.querySelectorAll('.reaction-pill[data-emoji]').forEach(btn => btn.onclick = (e) => {
        e.stopPropagation();
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        const emoji = btn.dataset.emoji;
        if (m && emoji) {
          const scope = activeDmFp ? 'dm' : (activeGroupId ? 'group' : 'channel');
          const scopeId = activeDmFp || activeGroupId || c.activeChannel;
          toggleMessageReaction(c, scope, scopeId, m.id || m.tempId, emoji);
        }
      });

      view.querySelectorAll('.msg-actions [data-act="edit"]').forEach(btn => btn.onclick = () => {
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        row.querySelector('.body').outerHTML = `<div class="msg-edit-box"><input maxlength="${c.maxMessageLength || 5000}" value="${escapeHtml(m.text)}"><button data-ok title="Valider la modification">✓</button></div>`;
        const box = row.querySelector('.msg-edit-box'); const input = box.querySelector('input'); input.focus();
        const commit = () => {
          const val = input.value.trim();
          if (val && val !== m.text) { activeGroupId ? editGroupMessage(c, activeGroupId, m, val) : editChannelMessage(c, c.activeChannel, m, val); }
          else renderMessages();
        };
        box.querySelector('[data-ok]').onclick = commit;
        input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') renderMessages(); });
      });
      view.querySelectorAll('.msg-actions [data-act="delete"]').forEach(btn => btn.onclick = () => {
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        if (window.confirm('Supprimer ce message ?')) { activeGroupId ? deleteGroupMessage(c, activeGroupId, m) : deleteChannelMessage(c, c.activeChannel, m); }
      });
      view.querySelectorAll('.msg-actions [data-act="retry"]').forEach(btn => btn.onclick = () => {
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        const m = msgs[idx];
        msgs.splice(idx, 1);
        if (activeDmFp) sendDmMessage(c, activeDmFp, m.text);
        else if (activeGroupId) sendGroupMessage(c, activeGroupId, m.text);
        else sendChannelMessage(c, c.activeChannel, m.text);
      });
      view.querySelectorAll('.msg-actions [data-act="dismiss"]').forEach(btn => btn.onclick = () => {
        const row = btn.closest('.msg'); const idx = parseInt(row.dataset.idx, 10);
        msgs.splice(idx, 1);
        renderMessages();
      });
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    /* ================= MODALS ================= */
    function openModal(html) {
      const root = document.getElementById('modalRoot');
      root.innerHTML = `<div class="modal">${html}</div>`;
      root.classList.remove('hidden');
      root.onclick = (e) => { if (e.target === root) closeModal(); };
    }
    function closeModal() { document.getElementById('modalRoot').classList.add('hidden'); }

    function openGroupMembersModal(c, groupId) {
      const group = c.groups.get(groupId);
      if (!group) return;
      const isCreator = group.createdBy === CURRENT.fingerprint;
      const membersHtml = group.members.map(m => {
        const isMe = m.fingerprint === CURRENT.fingerprint;
        return `<div class="member-row">
      <span class="dot" style="background:${m.online || isMe ? 'var(--signal)' : 'var(--text-dim)'}"></span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.username)}${isMe ? ' (toi)' : ''}${group.createdBy === m.fingerprint ? ' ★' : ''}</span>
      ${(isCreator && !isMe) ? `<button class="menu-btn" data-remove="${m.fingerprint}" title="Retirer du groupe" style="color:var(--danger);">✕</button>` : ''}
    </div>`;
      }).join('');
      const addableFriends = isCreator ? c.friends.filter(f => !group.members.find(m => m.fingerprint === f.fingerprint)) : [];
      openModal(`
    <h3>⚉ Membres — ${escapeHtml(group.name)}</h3>
    <p style="color:var(--text-dim);font-size:12px;margin:-8px 0 14px;">${group.members.length} membre${group.members.length > 1 ? 's' : ''}${isCreator ? ' · tu es le créateur, tu peux ajouter/retirer des membres' : ''}</p>
    <div class="step">${membersHtml}</div>
    ${isCreator ? `<div class="step"><label>Ajouter un ami au groupe</label>
      ${addableFriends.length ? addableFriends.map(f => `<div class="member-row"><span style="flex:1;">${escapeHtml(f.username)}</span><button class="menu-btn" data-add="${f.fingerprint}" title="Ajouter">＋</button></div>`).join('')
            : `<span class="mp-empty">Tous tes amis de ce relais sont déjà dans le groupe.</span>`}
    </div>` : ''}
    <div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Fermer</button></div>
  `);
      document.querySelectorAll('#modalRoot [data-remove]').forEach(btn => btn.onclick = () => {
        const target = btn.dataset.remove;
        const m = group.members.find(x => x.fingerprint === target);
        if (window.confirm(`Retirer ${m?.username || 'ce membre'} du groupe ?`)) {
          c.ws.send(JSON.stringify({ t: 'remove-group-member', groupId, target }));
          closeModal();
        }
      });
      document.querySelectorAll('#modalRoot [data-add]').forEach(btn => btn.onclick = () => {
        c.ws.send(JSON.stringify({ t: 'add-group-member', groupId, target: btn.dataset.add }));
        btn.textContent = '✓'; btn.disabled = true;
      });
    }

    function openUserProfileMenu(fp, username, avatar, memberInfo) {
      if (fp === CURRENT.fingerprint) return; // pas de menu sur soi-même ici (avatar de gauche gère déjà le sien)
      const bio = memberInfo?.bio || '';
      const shareServerList = memberInfo?.shareServerList !== false;
      const hiddenServers = memberInfo?.hiddenServers || [];
      // serveurs de salons en commun où cette personne est visible dans le roster
      const commonServers = shareServerList ? [...conns.values()].filter(cc =>
        cc.type === 'channels' && cc.roster.has(fp) && !hiddenServers.includes(cc.host + ':' + cc.port)
      ) : [];
      // relais MP où on pourrait l'ajouter en ami (elle n'y est pas déjà amie, et pas soi-même)
      const mpTargets = [...conns.values()].filter(cc => cc.type === 'mp' && !cc.friends.find(f => f.fingerprint === fp) && !cc.blocked.find(b => b.fingerprint === fp));
      // relais MP où cette personne est déjà amie (on peut la bloquer) ou déjà bloquée (on peut la débloquer)
      const mpFriendRelays = [...conns.values()].filter(cc => cc.type === 'mp' && cc.friends.find(f => f.fingerprint === fp));
      const mpBlockedRelays = [...conns.values()].filter(cc => cc.type === 'mp' && cc.blocked.find(b => b.fingerprint === fp));

      openModal(`
    <div class="profile-card">
      <div class="p-avatar">${avatarOrInitials(avatar, username, 72)}</div>
      <h3>${escapeHtml(username)}</h3>
      <div class="p-fp">${escapeHtml(fp)}</div>
      ${bio ? `<div class="p-bio">${escapeHtml(bio)}</div>` : `<div class="p-bio" style="color:var(--text-dim);font-style:italic;">Aucune description.</div>`}
      ${shareServerList ? `<div class="p-servers"><label style="display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;">Serveurs en commun</label>
        ${commonServers.length ? commonServers.map(cc => `<span class="srv-chip">${cc.icon ? cc.icon + ' ' : ''}${escapeHtml(cc.name)}</span>`).join('') : '<span class="mp-empty">Aucun serveur de salons en commun visible.</span>'}
      </div>` : `<div class="p-servers"><span class="mp-empty">Cette personne masque la liste de ses serveurs.</span></div>`}
      ${mpTargets.length ? `<div class="p-mp-targets"><label style="display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;">Ajouter en ami sur...</label>
        ${mpTargets.map(cc => `<button data-key="${cc.key}">＋ ${escapeHtml(cc.name)} (${cc.host}:${cc.port})</button>`).join('')}
      </div>` : ''}
      ${(mpFriendRelays.length || mpBlockedRelays.length) ? `<div class="p-mp-targets"><label style="display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;">Gestion des contacts</label>
        ${mpFriendRelays.map(cc => `<button data-block-key="${cc.key}" style="color:var(--danger);">✕ Bloquer sur ${escapeHtml(cc.name)}</button>`).join('')}
        ${mpBlockedRelays.map(cc => `<button data-unblock-key="${cc.key}">⚿ Débloquer sur ${escapeHtml(cc.name)}</button>`).join('')}
      </div>` : ''}
      <div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Fermer</button></div>
    </div>
  `);
      document.querySelectorAll('.p-mp-targets [data-key]').forEach(btn => btn.onclick = () => {
        const cc = conns.get(btn.dataset.key);
        if (cc && cc.ws && cc.ws.readyState === WebSocket.OPEN) {
          cc.ws.send(JSON.stringify({ t: 'friend-request', to: fp }));
          btn.textContent = '✓ Demande envoyée'; btn.disabled = true;
        }
      });
      document.querySelectorAll('[data-block-key]').forEach(btn => btn.onclick = () => {
        const cc = conns.get(btn.dataset.blockKey);
        if (cc && cc.ws && cc.ws.readyState === WebSocket.OPEN && window.confirm(`Bloquer ${username} sur ${cc.name} ?`)) {
          cc.ws.send(JSON.stringify({ t: 'block-user', target: fp }));
          closeModal();
        }
      });
      document.querySelectorAll('[data-unblock-key]').forEach(btn => btn.onclick = () => {
        const cc = conns.get(btn.dataset.unblockKey);
        if (cc && cc.ws && cc.ws.readyState === WebSocket.OPEN) {
          cc.ws.send(JSON.stringify({ t: 'unblock-user', target: fp }));
          btn.textContent = '✓ Débloqué'; btn.disabled = true;
        }
      });
    }

      document.getElementById('btnDoConnect').onclick = async () => {

      const savedEntry = myServerList().find(s => s.host === host && String(s.port) === String(port) && s.kindHint === kindHint);
      await connectToServer(host, port, label, kindHint, savedEntry?.myDisplayName);

    /* ================= ANNUAIRE CENTRAL DES SERVEURS ================= */
    const DEFAULT_DIRECTORY_URL = 'http://msg.playnix.fr';

    function getDirectorySources() {
      try {
        const raw = localStorage.getItem('msg_server_directories');
        let list = raw ? JSON.parse(raw) : null;
        if (!Array.isArray(list) || !list.length) {
          list = [DEFAULT_DIRECTORY_URL];
          localStorage.setItem('msg_server_directories', JSON.stringify(list));
        }
        if (!list.includes(DEFAULT_DIRECTORY_URL)) {
          list.unshift(DEFAULT_DIRECTORY_URL);
          localStorage.setItem('msg_server_directories', JSON.stringify(list));
        }
        return list;
      } catch (e) {
        return [DEFAULT_DIRECTORY_URL];
      }
    }

    function saveDirectorySources(list) {
      try {
        localStorage.setItem('msg_server_directories', JSON.stringify(list));
      } catch (e) {}
    }

    function getActiveDirectorySource() {
      const sources = getDirectorySources();
      const active = localStorage.getItem('msg_server_dir_active');
      if (active && sources.includes(active)) return active;
      return sources[0] || DEFAULT_DIRECTORY_URL;
    }

    function setActiveDirectorySource(url) {
      try {
        localStorage.setItem('msg_server_dir_active', url);
      } catch (e) {}
    }

    function normalizeDirectoryUrl(input) {
      let url = (input || '').trim();
      if (!url) return '';
      if (!/^https?:\/\//i.test(url)) {
        url = 'http://' + url;
      }
      return url.replace(/\/+$/, '');
    }

    async function fetchDirectoryServers(dirUrl) {
      const cleanUrl = normalizeDirectoryUrl(dirUrl);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch(`${cleanUrl}/api/servers`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return { ok: true, servers: data.servers || [], total: data.total || 0, dirUrl: cleanUrl };
      } catch (err) {
        clearTimeout(timer);
        return { ok: false, error: err.message, servers: [], dirUrl: cleanUrl };
      }
    }

    let _dirFilterType = 'all'; // 'all' | 'channels' | 'mp' | 'both'
    let _dirSearchQuery = '';
    let _dirCachedServers = [];

    async function openServerDirectoryModal() {
      const sources = getDirectorySources();
      let activeSource = getActiveDirectorySource();

      openModal(`
        <div class="dir-modal-container">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div>
              <h3 style="margin:0 0 4px;font-size:18px;">🧭 Annuaire des serveurs</h3>
              <p class="sub" style="margin:0;">Découvre et rejoins des serveurs publics propulsés par <b>serverListe.js</b></p>
            </div>
            <button class="icon-btn" onclick="closeModal()" title="Fermer" style="font-size:16px;">✕</button>
          </div>

          <!-- Barre de sélection de la source d'annuaire -->
          <div class="dir-source-bar">
            <label>Annuaire :</label>
            <select id="dirSourceSelect" class="dir-source-select">
              ${sources.map(s => `<option value="${escapeHtml(s)}" ${s === activeSource ? 'selected' : ''}>${escapeHtml(s)}${s === DEFAULT_DIRECTORY_URL ? ' (Par défaut)' : ''}</option>`).join('')}
            </select>
            <button class="btn-sm" id="btnDirAddSource" title="Ajouter un autre annuaire central">＋ Autre</button>
            <button class="btn-sm" id="btnDirRemoveSource" title="Supprimer cet annuaire de ma liste" ${sources.length <= 1 ? 'disabled style="opacity:0.4;"' : ''}>🗑</button>
            <button class="btn-sm" id="btnDirResetSources" title="Réinitialiser la liste (tout supprimer et remettre msg.playnix.fr)">↺ Reset</button>
            <button class="btn-sm" id="btnDirRefresh" title="Recharger la liste">↻</button>
          </div>

          <!-- Barre de recherche et filtres -->
          <div class="dir-toolbar">
            <div class="dir-search-wrap">
              <input id="dirSearchInput" class="dir-search-input" placeholder="🔍 Rechercher par nom, hôte, description..." value="${escapeHtml(_dirSearchQuery)}">
            </div>
            <div class="dir-chips">
              <div class="dir-chip ${_dirFilterType === 'all' ? 'active' : ''}" data-type="all">Tous</div>
              <div class="dir-chip ${_dirFilterType === 'channels' ? 'active' : ''}" data-type="channels">Salons</div>
              <div class="dir-chip ${_dirFilterType === 'mp' ? 'active' : ''}" data-type="mp">MP</div>
              <div class="dir-chip ${_dirFilterType === 'both' ? 'active' : ''}" data-type="both">Salons & MP</div>
            </div>
          </div>

          <!-- Conteneur grille des serveurs -->
          <div id="dirServerGrid" class="dir-grid">
            <div class="dir-empty">Chargement des serveurs en ligne...</div>
          </div>

          <div class="modal-actions" style="margin-top:4px;display:flex;justify-content:space-between;align-items:center;">
            <div id="dirStatusText" style="font-size:12px;color:var(--text-dim);"></div>
            <button class="btn-sm" onclick="closeModal()">Fermer</button>
          </div>
        </div>
      `);

      // Élargir la modale pour l'annuaire
      const modalBox = document.querySelector('#modalRoot .modal');
      if (modalBox) {
        modalBox.style.maxWidth = '780px';
        modalBox.style.width = '780px';
      }

      const selectEl = document.getElementById('dirSourceSelect');
      const addBtn = document.getElementById('btnDirAddSource');
      const removeBtn = document.getElementById('btnDirRemoveSource');
      const refreshBtn = document.getElementById('btnDirRefresh');
      const searchInput = document.getElementById('dirSearchInput');
      const chips = document.querySelectorAll('.dir-chip');

      async function loadDirectoryData() {
        const grid = document.getElementById('dirServerGrid');
        const statusText = document.getElementById('dirStatusText');
        if (!grid) return;

        activeSource = selectEl.value;
        setActiveDirectorySource(activeSource);
        grid.innerHTML = '<div class="dir-empty">Chargement des serveurs en ligne...</div>';
        if (statusText) statusText.textContent = `Interrogation de ${activeSource}...`;

        const res = await fetchDirectoryServers(activeSource);
        if (!res.ok) {
          grid.innerHTML = `
            <div class="dir-empty" style="border-color:var(--danger);color:#ff99a8;">
              <div style="font-size:24px;margin-bottom:6px;">⚠️</div>
              <b>Impossible de joindre l'annuaire central</b><br>
              <span style="font-size:12px;color:var(--text-dim);">Source : <code>${escapeHtml(res.dirUrl)}</code> (${escapeHtml(res.error)})</span>
              <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
                <button class="btn-sm" onclick="openServerDirectoryModal()">Réessayer</button>
              </div>
            </div>`;
          if (statusText) statusText.textContent = 'Erreur de connexion';
          return;
        }

        _dirCachedServers = res.servers;
        renderFilteredServers();
      }

      function renderFilteredServers() {
        const grid = document.getElementById('dirServerGrid');
        const statusText = document.getElementById('dirStatusText');
        if (!grid) return;

        const q = _dirSearchQuery.trim().toLowerCase();
        const filtered = _dirCachedServers.filter(srv => {
          if (_dirFilterType !== 'all' && srv.type !== _dirFilterType) return false;
          if (!q) return true;
          const matchName = (srv.name || '').toLowerCase().includes(q);
          const matchHost = (`${srv.host}:${srv.port}`).toLowerCase().includes(q);
          const matchDesc = (srv.description || '').toLowerCase().includes(q);
          const matchChannels = Array.isArray(srv.channels) && srv.channels.some(ch => ch.toLowerCase().includes(q));
          return matchName || matchHost || matchDesc || matchChannels;
        });

        if (statusText) {
          statusText.textContent = `${filtered.length} serveur(s) disponible(s) sur ${activeSource}`;
        }

        if (!filtered.length) {
          grid.innerHTML = `
            <div class="dir-empty">
              <div style="font-size:28px;margin-bottom:6px;">🔍</div>
              ${_dirCachedServers.length ? "Aucun serveur ne correspond à cette recherche ou ce filtre." : "Aucun serveur n'est actuellement annoncé sur cet annuaire."}
            </div>`;
          return;
        }

        const myServers = myServerList();

        grid.innerHTML = filtered.map(srv => {
          const isAdded = myServers.some(s => s.host === srv.host && String(s.port) === String(srv.port));
          const typeLabel = srv.type === 'both' ? 'Salons & MP' : (srv.type === 'mp' ? 'Relais MP' : 'Salons');
          const typeClass = srv.type === 'both' ? 'both' : (srv.type === 'mp' ? 'mp' : 'channels');
          const iconDisplay = srv.icon || (srv.type === 'mp' ? '⚉' : (srv.type === 'both' ? '★' : '#'));
          const desc = srv.description || (srv.type === 'mp' ? 'Relais de messages privés et groupes' : 'Serveur à salons textuels et vocaux');
          const clientCount = typeof srv.clientCount === 'number' ? srv.clientCount : 0;

          return `
            <div class="dir-card">
              <div class="dir-card-head">
                <div class="dir-card-icon ${typeClass}">${escapeHtml(iconDisplay)}</div>
                <div class="dir-card-info">
                  <div class="dir-card-name" title="${escapeHtml(srv.name)}">${escapeHtml(srv.name)}</div>
                  <div class="dir-card-host">${escapeHtml(srv.host)}:${srv.port}</div>
                </div>
              </div>
              <div class="dir-card-desc" title="${escapeHtml(desc)}">${escapeHtml(desc)}</div>
              <div class="dir-card-foot">
                <div class="dir-card-meta">
                  <span class="dir-tag ${typeClass}">${typeLabel}</span>
                  <span title="Utilisateurs connectés">👥 ${clientCount}</span>
                </div>
                <button class="btn-sm ${isAdded ? '' : 'primary'}" 
                  data-host="${escapeHtml(srv.host)}" 
                  data-port="${srv.port}" 
                  data-name="${escapeHtml(srv.name)}" 
                  data-type="${escapeHtml(srv.type)}" 
                  onclick="quickJoinFromDirectory(this)">
                  ${isAdded ? '✓ Déjà ajouté' : 'Rejoindre'}
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      selectEl.onchange = () => {
        loadDirectoryData();
      };

      refreshBtn.onclick = () => {
        loadDirectoryData();
      };

      searchInput.oninput = (e) => {
        _dirSearchQuery = e.target.value;
        renderFilteredServers();
      };

      chips.forEach(chip => {
        chip.onclick = () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          _dirFilterType = chip.dataset.type;
          renderFilteredServers();
        };
      });

      addBtn.onclick = () => {
        const input = window.prompt("Entre l'adresse URL du serveur central d'annuaire (serverListe.js) :", "http://");
        if (!input) return;
        const norm = normalizeDirectoryUrl(input);
        if (!norm) return;
        const curSources = getDirectorySources();
        if (!curSources.includes(norm)) {
          curSources.push(norm);
          saveDirectorySources(curSources);
        }
        setActiveDirectorySource(norm);
        openServerDirectoryModal();
      };

      removeBtn.onclick = () => {
        const cur = selectEl.value;
        const curSources = getDirectorySources();
        if (curSources.length <= 1) {
          alert("Tu ne peux pas supprimer le dernier annuaire de la liste.");
          return;
        }
        if (window.confirm(`Supprimer "${cur}" de ta liste d'annuaires ?`)) {
          const updated = curSources.filter(s => s !== cur);
          saveDirectorySources(updated);
          setActiveDirectorySource(updated[0]);
          openServerDirectoryModal();
        }
      };

      const resetBtn = document.getElementById('btnDirResetSources');
      if (resetBtn) {
        resetBtn.onclick = () => {
          if (window.confirm("Réinitialiser tous les annuaires et restaurer uniquement celui par défaut (msg.playnix.fr) ?")) {
            saveDirectorySources([DEFAULT_DIRECTORY_URL]);
            setActiveDirectorySource(DEFAULT_DIRECTORY_URL);
            openServerDirectoryModal();
          }
        };
      }

      loadDirectoryData();
    }

    window.quickJoinFromDirectory = async function(btn) {
      const host = btn.dataset.host;
      const port = parseInt(btn.dataset.port, 10);
      const name = btn.dataset.name || `${host}:${port}`;
      const type = btn.dataset.type || 'channels';
      const kindHint = type === 'both' ? 'channels' : type;

      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        await connectToServer(host, port, name, kindHint);
        addServerToList(host, port, name, kindHint);
        selectServer(connKey(host, port, kindHint));
        closeModal();
      } catch (err) {
        alert(`Échec de connexion à ${name} (${host}:${port}) : ${err.message}`);
        btn.disabled = false;
        btn.textContent = 'Rejoindre';
      }
    };

    /* ================= AVATAR ================= */
    let _avatarPickerFromSettings = false; // pour savoir s'il faut rafraîchir la modale Paramètres après coup
    function openAvatarPicker(fromSettings) {
      _avatarPickerFromSettings = !!fromSettings;
      document.getElementById('avatarFileInput').click();
    }
    document.getElementById('myAvatarWrap').addEventListener('click', () => openAvatarPicker(false));
    document.getElementById('avatarFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      img.onload = () => {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        persistMyAvatar(dataUrl); // met aussi à jour CURRENT.avatar et notifie les serveurs déjà connectés
        renderSidebar();
        if (_avatarPickerFromSettings) { closeModal(); openSettings(); } // rafraîchit l'aperçu dans Paramètres
      };
      reader.readAsDataURL(file);
    });

    /* ================= AUTH WIRING ================= */
    let authMode = 'login';
    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('authSubmit').textContent = mode === 'login' ? 'Se connecter' : 'Créer mon identité';
      document.getElementById('authError').textContent = '';
      const showBtn = document.getElementById('authShowExisting');
      const list = document.getElementById('authExistingList');
      list.classList.add('hidden');
      list.innerHTML = '';
      const hasAccounts = Object.keys(loadUsersDb()).length > 0;
      if (mode === 'login' && hasAccounts) {
        showBtn.classList.remove('hidden');
        showBtn.textContent = '◉ Voir les comptes enregistrés sur cet appareil';
      } else {
        showBtn.classList.add('hidden');
      }
    }
    function renderExistingAccountsList() {
      const list = document.getElementById('authExistingList');
      const names = Object.keys(loadUsersDb());
      list.innerHTML = names.map(n => `<span class="acct-chip"><button type="button" class="acct-pick" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button><button type="button" class="acct-del" data-name="${escapeHtml(n)}" title="Supprimer ce compte de cet appareil">✕</button></span>`).join('');
      list.querySelectorAll('.acct-pick').forEach(btn => btn.onclick = () => {
        document.getElementById('authUser').value = btn.dataset.name;
        list.querySelectorAll('.acct-pick').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        document.getElementById('authPass').focus();
      });
      list.querySelectorAll('.acct-del').forEach(btn => btn.onclick = () => {
        const name = btn.dataset.name;
        if (!window.confirm(`Supprimer définitivement le compte "${name}" de cet appareil ?\nCela ne supprime rien côté serveurs, juste l'identité locale (et sa clé privée) sur ce navigateur.`)) return;
        const db = loadUsersDb();
        delete db[name];
        saveUsersDb(db);
        const remembered = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
        if (remembered && remembered.username === name) clearRememberedSession();
        if (document.getElementById('authUser').value === name) document.getElementById('authUser').value = '';
        renderExistingAccountsList();
        if (!Object.keys(loadUsersDb()).length) setAuthMode('register'); // plus aucun compte -> retour à la création
      });
    }
    document.getElementById('authShowExisting').addEventListener('click', () => {
      const list = document.getElementById('authExistingList');
      const showBtn = document.getElementById('authShowExisting');
      const willShow = list.classList.contains('hidden');
      if (willShow) { renderExistingAccountsList(); list.classList.remove('hidden'); showBtn.textContent = '○ Masquer les comptes enregistrés'; }
      else { list.classList.add('hidden'); showBtn.textContent = '◉ Voir les comptes enregistrés sur cet appareil'; }
    });
    document.getElementById('tabLogin').addEventListener('click', () => setAuthMode('login'));
    document.getElementById('tabRegister').addEventListener('click', () => setAuthMode('register'));
    async function submitAuth() {
      const username = document.getElementById('authUser').value.trim();
      const password = document.getElementById('authPass').value;
      const errEl = document.getElementById('authError');
      errEl.textContent = '';
      if (!username || !password) { errEl.textContent = 'Pseudo et mot de passe requis.'; return; }
      if (password.length < 6) { errEl.textContent = 'Mot de passe trop court (6 caractères min).'; return; }
      try {
        if (authMode === 'register') await registerUser(username, password);
        else await loginUser(username, password);
        if (document.getElementById('authRemember').checked) await persistRememberedSession(CURRENT.username, CURRENT.vaultKey);
        else clearRememberedSession();
        enterApp();
      } catch (e) { errEl.textContent = e.message; }
    }
    document.getElementById('authSubmit').addEventListener('click', submitAuth);
    document.getElementById('authPass').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.toggle-password-btn');
      if (!btn) return;
      const targetId = btn.dataset.for;
      const input = targetId ? document.getElementById(targetId) : btn.parentElement?.querySelector('input');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '○';
        btn.title = 'Masquer le mot de passe';
      } else {
        input.type = 'password';
        btn.textContent = '◉';
        btn.title = 'Afficher le mot de passe';
      }
    });
    document.getElementById('authImportBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
    document.getElementById('importFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const errEl = document.getElementById('authError');
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (parsed.meshExport !== 1 || !parsed.salt || !parsed.pubJwk || !parsed.wrappedPriv) throw new Error('format');
        openImportProfileModal(parsed);
      } catch (err) { errEl.textContent = 'Fichier de profil invalide.'; }
    });
    function enterApp() {
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      setMobileScreen('rail');
      renderRail(); renderSidebar(); renderMain();
      reconnectSavedServers();
      ensureNotificationPermission();
    }
    document.getElementById('btnLogout').addEventListener('click', () => { clearRememberedSession(); location.reload(); });
    document.getElementById('btnSettings').addEventListener('click', openSettings);
    document.getElementById('btnBackToRail').addEventListener('click', () => setMobileScreen('rail'));
    window.addEventListener('focus', () => { const c = conns.get(activeKey); if (c) markVisibleMessagesRead(c); });

    /* ---- démarrage : si une session est mémorisée ("rester connecté"), on rentre directement,
       sinon on affiche l'écran de connexion (par défaut sur "Se connecter" s'il existe déjà une
       identité sur cet appareil, sinon sur "Créer un compte" au tout premier lancement) ---- */
    (async function boot() {
      if (await tryAutoLogin()) { enterApp(); return; }
      const hasAccounts = Object.keys(loadUsersDb()).length > 0;
      setAuthMode(hasAccounts ? 'login' : 'register');
      document.getElementById('auth').classList.remove('hidden');
    })();
  </script>
</body>

</html>
