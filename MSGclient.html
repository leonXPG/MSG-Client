      <input type="file" id="importFileInput" accept="application/json,.json" class="hidden">
      <div class="auth-foot">AES-256-GCM · ECDH P-256 · PBKDF2 100k</div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="rail" id="rail"></div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="head-row"><button class="mobile-back" id="btnBackToRail" title="Retour aux serveurs">‹</button>
          <h2 id="serverName">—</h2>
        </div>
        <div class="fp" id="serverInfo"></div>
        <span class="role-badge hidden" id="roleBadge"></span>
      </div>
      <div class="channels" id="channelsList"></div>
      <div class="user-footer">
        <div class="avatar-wrap" id="myAvatarWrap" title="Changer ma photo de profil">
          <div class="avatar" id="meAvatar">--</div>
        </div>
        <div class="who">
          <div id="meName">—</div><small id="meFp">—</small>
        </div>
        <button class="icon-btn" id="btnSettings" title="Paramètres">⛭</button>
        <button class="icon-btn" id="btnLogout" title="Se déconnecter">✕</button>
      </div>
    </div>

    <div class="main" id="mainView">
      <div class="empty-state">
        <h2>Aucun serveur sélectionné</h2>
        <p>« + » en haut pour un serveur de salons, « + » en bas pour un relais MP — chacun se rejoint par IP:port.</p>
      </div>
    </div>
  </div>

  <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
  <div class="overlay hidden" id="modalRoot"></div>

  <script>
    /* ================= CRYPTO ================= */
    const enc = new TextEncoder(), dec = new TextDecoder();
    function b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
    function unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

    const PBKDF2_ITERATIONS_CURRENT = 310000; // OWASP-recommended floor for PBKDF2-HMAC-SHA256 (2023+)
    async function pbkdf2(password, salt, iterations = PBKDF2_ITERATIONS_CURRENT) {
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    }
    async function aesEncrypt(key, plaintext) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
      return { iv: b64(iv), ct: b64(ct) };
    }
    async function aesDecrypt(key, ivB64, ctB64) {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(ivB64) }, key, unb64(ctB64));
      return dec.decode(pt);
    }
    async function genIdentityKeypair() { return crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']); }
    async function exportPub(pk) { return crypto.subtle.exportKey('jwk', pk); }
    async function importPub(jwk) { return crypto.subtle.importKey('jwk', jwk, { name: 'ECDH', namedCurve: 'P-256' }, true, []); }
    async function fingerprintOf(pubJwk) {
      const hash = await crypto.subtle.digest('SHA-256', enc.encode(JSON.stringify(pubJwk)));
      const hex = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
      return hex.slice(0, 16).match(/.{1,4}/g).join('-');
    }
    async function derivePairwiseKey(myPriv, theirPub) {
      return crypto.subtle.deriveKey({ name: 'ECDH', public: theirPub }, myPriv, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    /* clés de salon / groupe partagées (room keys) */
    async function generateRoomKey() { return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']); }
    async function exportRoomKeyB64(key) { return b64(await crypto.subtle.exportKey('raw', key)); }
    async function importRoomKeyB64(str) { return crypto.subtle.importKey('raw', unb64(str), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']); }

    /* ================= VAULT ================= */
    const DB_KEY = 'mesh_users_v4';
    function loadUsersDb() { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); }
    function saveUsersDb(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    const DANGEROUS_LOCAL_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
    function isSafeUsernameKey(v) { return typeof v === 'string' && v.length > 0 && v.length <= 64 && !DANGEROUS_LOCAL_KEYS.has(v); }

    let CURRENT = {
      username: null, vaultKey: null, privateKey: null, publicJwk: null, fingerprint: null, avatar: null,
      bio: '', shareServerList: true, hiddenServers: []
    };

    async function registerUser(username, password) {
      if (!isSafeUsernameKey(username)) throw new Error('Pseudo invalide.');
      const db = loadUsersDb();
      if (db[username]) throw new Error('Ce pseudo existe déjà sur cet appareil.');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const vaultKey = await pbkdf2(password, salt);
      const kp = await genIdentityKeypair();
      const pubJwk = await exportPub(kp.publicKey);
      const privJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
      const wrapped = await aesEncrypt(vaultKey, JSON.stringify(privJwk));
      db[username] = { salt: b64(salt), pubJwk, wrappedPriv: wrapped, servers: [], avatar: null, iterations: PBKDF2_ITERATIONS_CURRENT };
      saveUsersDb(db);
      return loginUser(username, password);
    }
    async function loginUser(username, password) {
      if (!isSafeUsernameKey(username)) throw new Error('Pseudo invalide.');
      const db = loadUsersDb();
      const rec = db[username];
      if (!rec) throw new Error("Aucune identité de ce nom sur cet appareil.");
      // les comptes créés avant ce renforcement utilisaient 100 000 itérations : on les déverrouille
      // toujours avec leur propre valeur d'origine, pour ne pas casser les identités existantes.
      const vaultKey = await pbkdf2(password, unb64(rec.salt), rec.iterations || 100000);
      let privJwkStr;
      try { privJwkStr = await aesDecrypt(vaultKey, rec.wrappedPriv.iv, rec.wrappedPriv.ct); }
      catch (e) { throw new Error('Mot de passe incorrect.'); }
      const privateKey = await crypto.subtle.importKey('jwk', JSON.parse(privJwkStr), { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']);
      const fp = await fingerprintOf(rec.pubJwk);
      CURRENT = {
        username, vaultKey, privateKey, publicJwk: rec.pubJwk, fingerprint: fp, avatar: rec.avatar || null,
        bio: rec.bio || '', shareServerList: rec.shareServerList !== false, hiddenServers: rec.hiddenServers || []
      };
      if (!rec.servers) rec.servers = [];
      await loadSavedRoomKeys();
      return CURRENT;
    }
    function persistMyServerList(list) { const db = loadUsersDb(); db[CURRENT.username].servers = list; saveUsersDb(db); }
    function myServerList() { const db = loadUsersDb(); return (db[CURRENT.username] && db[CURRENT.username].servers) || []; }
    function persistMyAvatar(dataUrl) { const db = loadUsersDb(); db[CURRENT.username].avatar = dataUrl; saveUsersDb(db); CURRENT.avatar = dataUrl; broadcastProfileToServers(); }

    /* ---- "rester connecté" : on retient la clé de coffre déjà déverrouillée (pas le mot de
       passe) dans localStorage, pour pouvoir rouvrir le coffre sans le retaper au prochain
       lancement. À utiliser en connaissance de cause sur un appareil personnel uniquement :
       quiconque a accès à ce navigateur peut alors ouvrir l'identité sans mot de passe. ---- */
    const REMEMBER_KEY = 'mesh-remember-v1';
    async function persistRememberedSession(username, vaultKey) {
      try {
        const raw = await crypto.subtle.exportKey('raw', vaultKey);
        localStorage.setItem(REMEMBER_KEY, JSON.stringify({ username, vaultKeyB64: b64(raw) }));
      } catch (e) { }
    }
    function clearRememberedSession() { localStorage.removeItem(REMEMBER_KEY); }
    async function tryAutoLogin() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(REMEMBER_KEY)); } catch (e) { return false; }
      if (!saved || !saved.username || !saved.vaultKeyB64) return false;
      const db = loadUsersDb();
      const rec = db[saved.username];
      if (!rec) { clearRememberedSession(); return false; }
      try {
        const vaultKey = await crypto.subtle.importKey('raw', unb64(saved.vaultKeyB64), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
        const privJwkStr = await aesDecrypt(vaultKey, rec.wrappedPriv.iv, rec.wrappedPriv.ct);
        const privateKey = await crypto.subtle.importKey('jwk', JSON.parse(privJwkStr), { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']);
        const fp = await fingerprintOf(rec.pubJwk);
        CURRENT = {
          username: saved.username, vaultKey, privateKey, publicJwk: rec.pubJwk, fingerprint: fp, avatar: rec.avatar || null,
          bio: rec.bio || '', shareServerList: rec.shareServerList !== false, hiddenServers: rec.hiddenServers || []
        };
        if (!rec.servers) rec.servers = [];
        await loadSavedRoomKeys();
        return true;
      } catch (e) { clearRememberedSession(); return false; }
    }

    /* ================= TROUSSEAU DE CLÉS LOCAL (SALONS / GROUPES) =================
       Permet de conserver les clés de salon et de groupe chiffrées dans le coffre
       local de l'utilisateur. Ainsi, si tout le monde se déconnecte puis qu'un membre
       se reconnecte, l'historique et l'envoi de messages restent immédiatement fonctionnels
       sans blocage et sans message "En attente de la clé". */
    let SAVED_ROOM_KEYS = { channels: {}, groups: {} };

    async function loadSavedRoomKeys() {
      SAVED_ROOM_KEYS = { channels: {}, groups: {} };
      if (!CURRENT.username || !CURRENT.vaultKey) return;
      const db = loadUsersDb();
      const rec = db[CURRENT.username];
      if (!rec || !rec.wrappedKeys) return;
      try {
        const jsonStr = await aesDecrypt(CURRENT.vaultKey, rec.wrappedKeys.iv, rec.wrappedKeys.ct);
        const parsed = JSON.parse(jsonStr);
        if (parsed && typeof parsed === 'object') {
          SAVED_ROOM_KEYS.channels = parsed.channels || {};
          SAVED_ROOM_KEYS.groups = parsed.groups || {};
        }
      } catch (e) {
        console.warn("Échec du déchiffrement du trousseau local de clés", e);
      }
    }

    async function rememberRoomKey(scope, scopeId, key, serverIdentifier) {
      if (!CURRENT.username || !CURRENT.vaultKey || !key) return;
      try {
        const rawB64 = await exportRoomKeyB64(key);
        if (scope === 'group') {
          SAVED_ROOM_KEYS.groups[scopeId] = rawB64;
        } else {
          const channelKey = (serverIdentifier || 'default') + '#' + scopeId;
          SAVED_ROOM_KEYS.channels[channelKey] = rawB64;
        }
        const db = loadUsersDb();
        if (!db[CURRENT.username]) return;
        const jsonStr = JSON.stringify(SAVED_ROOM_KEYS);
        db[CURRENT.username].wrappedKeys = await aesEncrypt(CURRENT.vaultKey, jsonStr);
        saveUsersDb(db);
      } catch (e) {
        console.warn("Échec de sauvegarde de la clé locale", e);
      }
    }

    async function forgetSavedGroupKey(groupId) {
      if (!CURRENT.username || !CURRENT.vaultKey || !SAVED_ROOM_KEYS.groups[groupId]) return;
      try {
        delete SAVED_ROOM_KEYS.groups[groupId];
        const db = loadUsersDb();
        if (!db[CURRENT.username]) return;
        db[CURRENT.username].wrappedKeys = await aesEncrypt(CURRENT.vaultKey, JSON.stringify(SAVED_ROOM_KEYS));
        saveUsersDb(db);
      } catch (e) {}
    }

    async function restoreSavedGroupKey(c, groupId) {
      if (c.groupRoomKeys.has(groupId)) return c.groupRoomKeys.get(groupId);
      const rawB64 = SAVED_ROOM_KEYS.groups[groupId];
      if (!rawB64) return null;
      try {
        const key = await importRoomKeyB64(rawB64);
        c.groupRoomKeys.set(groupId, key);
        await flushGroupPendingCipher(c, groupId);
        return key;
      } catch (e) {
        return null;
      }
    }

    async function restoreSavedChannelKey(c, channel) {
      if (c.roomKeys.has(channel)) return c.roomKeys.get(channel);
      const serverKey = (c.host + ':' + c.port) + '#' + channel;
      const rawB64 = SAVED_ROOM_KEYS.channels[serverKey];
      if (!rawB64) return null;
      try {
        const key = await importRoomKeyB64(rawB64);
        c.roomKeys.set(channel, key);
        await flushPendingCipher(c, channel);
        return key;
      } catch (e) {
        return null;
      }
    }

    /* ---- export / import de profil (fichier chiffré, transportable vers un autre appareil) ----
       Le fichier exporté ne contient JAMAIS la clé privée en clair : il transporte exactement
       le même blob chiffré (AES-GCM, authentifié) que celui stocké localement, protégé par le
       même mot de passe. Sans ce mot de passe, le fichier est inutilisable. Et même en cas de
       falsification du fichier (ex: clé publique substituée), l'identité importée ne pourrait
       jamais réussir le défi cryptographique d'un serveur (voir server.js) : la clé privée
       réelle ne correspondrait plus à la clé publique modifiée. Un client ou serveur modifié
       ne peut donc pas s'en servir pour usurper qui que ce soit d'autre. */
    function exportMyProfile() {
      const db = loadUsersDb();
      const rec = db[CURRENT.username];
      if (!rec) return;
      const payload = {
        meshExport: 1, exportedAt: Date.now(), username: CURRENT.username,
        salt: rec.salt, pubJwk: rec.pubJwk, wrappedPriv: rec.wrappedPriv, iterations: rec.iterations || 100000,
        avatar: rec.avatar || null, bio: rec.bio || '',
        shareServerList: rec.shareServerList !== false, hiddenServers: rec.hiddenServers || [],
        servers: rec.servers || [],
        themes: loadThemesDb(), // thèmes personnalisés sauvegardés (apparence de l'interface)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `mesh-identity-${CURRENT.username}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    function openImportProfileModal(parsed) {
      const suggested = (parsed.username || '').trim() || 'identité importée';
      openModal(`
    <h3>⚿ Importer un profil</h3>
    <p style="color:var(--text-dim);font-size:12.5px;margin:-8px 0 16px;line-height:1.5;">
      Fichier de profil chiffré. Entre le mot de passe qui a servi à l'exporter pour le déverrouiller sur cet appareil — sans lui, ce fichier est inutilisable.
    </p>
    <div class="step"><label>Pseudo à utiliser ici</label><input id="importUsername" value="${escapeHtml(suggested)}"></div>
    <div class="step"><label>Mot de passe du profil</label>
      <div class="password-wrap">
        <input id="importPassword" type="password">
        <button type="button" class="toggle-password-btn" data-for="importPassword" title="Afficher le mot de passe" tabindex="-1">◉</button>
      </div>
    </div>
    <div class="auth-error" id="importError"></div>
    <div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Annuler</button><button class="btn-sm primary" id="btnDoImport">Importer</button></div>
  `);
      document.getElementById('importPassword').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnDoImport').click(); });
      document.getElementById('btnDoImport').onclick = async () => {
        const username = document.getElementById('importUsername').value.trim();
        const password = document.getElementById('importPassword').value;
        const errEl = document.getElementById('importError');
        errEl.textContent = '';
        if (!username || !password) { errEl.textContent = 'Pseudo et mot de passe requis.'; return; }
        if (!isSafeUsernameKey(username)) { errEl.textContent = 'Pseudo invalide.'; return; }
        try {
          // on vérifie que le mot de passe déverrouille bien la clé avant d'écrire quoi que ce soit sur cet appareil
          const iterations = (typeof parsed.iterations === 'number' && parsed.iterations >= 10000 && parsed.iterations <= 2000000) ? parsed.iterations : 100000;
          const vaultKey = await pbkdf2(password, unb64(parsed.salt), iterations);
          await aesDecrypt(vaultKey, parsed.wrappedPriv.iv, parsed.wrappedPriv.ct);
          const db = loadUsersDb();
          if (db[username] && !window.confirm(`Une identité "${username}" existe déjà sur cet appareil. L'écraser avec celle importée ?`)) return;
          const existingServers = (db[username] && db[username].servers) || [];
          const importedServers = Array.isArray(parsed.servers) ? parsed.servers : [];
          const mergedServers = [...existingServers];
          for (const s of importedServers) {
            if (s && s.host && s.port && !mergedServers.find(x => x.host === s.host && String(x.port) === String(s.port) && x.kindHint === s.kindHint)) mergedServers.push(s);
          }
          db[username] = {
            salt: parsed.salt, pubJwk: parsed.pubJwk, wrappedPriv: parsed.wrappedPriv, iterations,
            avatar: parsed.avatar || null, bio: parsed.bio || '', shareServerList: parsed.shareServerList !== false,
            hiddenServers: parsed.hiddenServers || [], servers: mergedServers
          };
          saveUsersDb(db);
          // thèmes personnalisés : on ajoute ceux du fichier qui n'existent pas déjà ici (sous ce nom)
          if (parsed.themes && parsed.themes.saved && typeof parsed.themes.saved === 'object') {
            const themesDb = loadThemesDb();
            let importedAny = false;
            const dangerousNames = new Set(['__proto__', 'constructor', 'prototype']);
            for (const [name, values] of Object.entries(parsed.themes.saved)) {
              if (Object.keys(themesDb.saved).length >= 100) break; // plafond anti-abus
              if (typeof name !== 'string' || !name || name.length > 60 || dangerousNames.has(name)) continue;
              if (!Object.prototype.hasOwnProperty.call(themesDb.saved, name) && values && typeof values === 'object' && !Array.isArray(values)) {
                themesDb.saved[name] = values; importedAny = true;
              }
            }
            if (!themesDb.active && typeof parsed.themes.active === 'string' && !dangerousNames.has(parsed.themes.active) && Object.prototype.hasOwnProperty.call(themesDb.saved, parsed.themes.active)) themesDb.active = parsed.themes.active;
            if (importedAny || parsed.themes.active) saveThemesDb(themesDb);
            initTheme(); // applique immédiatement le thème importé s'il vient d'être activé
          }
          closeModal();
          await loginUser(username, password);
          const remember = document.getElementById('authRemember');
          if (remember && remember.checked) await persistRememberedSession(username, CURRENT.vaultKey);
          enterApp();
        } catch (e) {
          errEl.textContent = 'Mot de passe incorrect ou fichier invalide.';
        }
      };
    }

    function broadcastProfileToServers() {
      for (const c of conns.values()) {
        if (c.ws && c.ws.readyState === WebSocket.OPEN) c.ws.send(JSON.stringify({ t: 'update-profile', bio: CURRENT.bio, shareServerList: CURRENT.shareServerList, hiddenServers: CURRENT.hiddenServers, avatar: CURRENT.avatar }));
      }
    }
    function persistMyProfile() {
      const db = loadUsersDb();
      db[CURRENT.username].bio = CURRENT.bio;
      db[CURRENT.username].shareServerList = CURRENT.shareServerList;
      db[CURRENT.username].hiddenServers = CURRENT.hiddenServers;
      saveUsersDb(db);
      broadcastProfileToServers(); // notifie tous les serveurs déjà connectés (ils rediffuseront ces infos à leur roster)
    }
    function renameCurrentUser(newUsername) {
      const username = newUsername.trim();
      if (!isSafeUsernameKey(username)) throw new Error('Pseudo invalide.');
      const db = loadUsersDb();
      if (db[username] && username !== CURRENT.username) throw new Error('Ce pseudo existe déjà sur cet appareil.');
      if (username === CURRENT.username) return;
      db[username] = db[CURRENT.username];
      delete db[CURRENT.username];
      saveUsersDb(db);
      CURRENT.username = username;
    }

    /* ================= SONS (générés, pas de fichiers externes) ================= */
    let _audioCtx = null;
    function _ac() { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return _audioCtx; }
    function playTone(freq, duration, delay = 0, type = 'sine', vol = 0.08) {
      try {
        const ctx = _ac(); const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + duration + 0.02);
      } catch (e) { }
    }
    function soundJoinVoice() { playTone(520, 0.09, 0); playTone(780, 0.11, 0.08); }
    function soundLeaveVoice() { playTone(620, 0.09, 0); playTone(360, 0.13, 0.07); }
    function soundNotify() { playTone(880, 0.07, 0); playTone(1200, 0.09, 0.06); }
    let _ringInterval = null;
    function soundRingStart() {
      if (_ringInterval) return;
      const ring = () => { playTone(700, 0.25, 0); playTone(880, 0.25, 0.28); };
      ring(); _ringInterval = setInterval(ring, 1600);
    }
    function soundRingStop() { if (_ringInterval) { clearInterval(_ringInterval); _ringInterval = null; } }

    /* ================= NOTIFICATIONS SYSTÈME ================= */
    function ensureNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => { });
    }
    function bumpUnread(map, key) { map.set(key, (map.get(key) || 0) + 1); renderSidebar(); renderRail(); }
    function clearUnread(map, key) { if (map.has(key) && map.get(key) > 0) { map.set(key, 0); } }
    function sumUnread(map) { let t = 0; for (const v of map.values()) t += v; return t; }
    function notifyUser(title, body) {
      soundNotify();
      if (document.visibilityState === 'visible' && document.hasFocus()) return;
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(title, { body, icon: undefined }); } catch (e) { }
      }
    }

    /* ================= STATE ================= */
    const conns = new Map();
    let activeKey = null;
    let activeDmFp = null;
    let activeGroupId = null;
    let localStream = null;
    let screenStream = null;
    let cameraStream = null;
    const remoteVideoTiles = new Map();
    const peerTrackTypes = new Map(); // trackId -> 'camera' | 'screen'
    let micMuted = false; // pas muet par défaut dans un vocal
    let deafened = false;
    const STUN = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let CURRENT_REPLY = null; // { id, author, snippet, from }
    let ACTIVE_REACTION_POPUP = null;

    function parseMessageReply(rawText) {
      if (typeof rawText !== 'string') return { replyTo: null, cleanText: rawText };
      const match = rawText.match(/^\[REPLY:(\{[\s\S]*?\})\]\n?([\s\S]*)$/);
      if (match) {
        try {
          const replyTo = JSON.parse(match[1]);
          return { replyTo, cleanText: match[2] };
        } catch (e) {}
      }
      return { replyTo: null, cleanText: rawText };
    }

    function connKey(host, port, type) { return host + ':' + port + '#' + (type || 'channels'); }
    /* Un avatar ne DOIT être qu'une image encodée en data: URL — jamais inséré tel quel dans le
       HTML sans validation, car il est reçu depuis d'autres utilisateurs (roster, amis, groupes...)
       et un client modifié pourrait y glisser du HTML/JS pour l'injecter chez tout le monde qui
       affiche son avatar. On valide strictement le format avant de l'utiliser comme attribut src. */
    function isSafeAvatarDataUrl(v) {
      return typeof v === 'string' && v.length < 60000 && /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/]+=*$/.test(v);
    }
    function avatarOrInitials(avatar, name, size) {

    function toHexColor(val) {
      // les <input type=color> exigent du #rrggbb ; on convertit au cas où une valeur rgb() traînerait.
      // Sortie strictement validée : cette valeur est ensuite insérée telle quelle dans un attribut
      // HTML (value="..."), donc jamais question de renvoyer autre chose qu'un hex propre, même si
      // la donnée vient d'un thème importé depuis un fichier potentiellement trafiqué.
      const isHex = v => /^#[0-9a-fA-F]{6}$/.test(v);
      if (!val || typeof val !== 'string') return '#000000';
      val = val.trim();
      if (val.startsWith('#')) {
        if (val.length === 4 && /^#[0-9a-fA-F]{3}$/.test(val)) {
          const full = '#' + [...val.slice(1)].map(c => c + c).join('');
          return isHex(full) ? full : '#000000';
        }
        return isHex(val) ? val : '#000000';
      }
      const m = val.match(/^rgba?\((\d{1,3}),\s*(\d{1,3}),\s*(\d{1,3})/);
      if (m) {
        const hex = '#' + m.slice(1, 4).map(n => Math.min(255, +n).toString(16).padStart(2, '0')).join('');
        return isHex(hex) ? hex : '#000000';
      }
      return '#000000';
    }

    async function connectToServer(host, port, label, kindHint, myDisplayName) {
      const key = connKey(host, port, kindHint);
      if (conns.has(key)) {
        const existing = conns.get(key);
        if (myDisplayName) existing.myDisplayName = myDisplayName;
        if (!existing.connected) retryConnection(existing); // on retente une connexion morte au lieu de rien faire
        selectServer(key);
        return existing;
      }
      const savedEntry = myServerList().find(s => s.host === host && String(s.port) === String(port) && s.kindHint === kindHint);
      const effectiveDisplayName = myDisplayName || (savedEntry && savedEntry.myDisplayName) || null;
      const ws = new WebSocket(`ws://${host}:${port}/`);
      const c = {
        key, host, port, label: label || key, ws,
        type: kindHint || 'channels', name: label || key, icon: null, maxMessageLength: 5000,
        role: 'member', myDisplayName: effectiveDisplayName, // pseudo local à CE serveur seulement, si conflit détecté
        roles: [], defaultRoleId: 'member', userRoles: {}, onboardingQuiz: null, myRoles: [], myRoleIds: [],
        channels: ['general'], activeChannel: 'general',
        roster: new Map(), messages: { general: [] },
        roomKeys: new Map(),          // channel -> CryptoKey
        pendingCipher: new Map(),     // channel -> [{from,iv,ct,ts}] en attente de clé
        keyRequested: new Set(),
        voiceChannels: ['Général'], activeVoiceChannel: null,
        voiceChannelMembers: new Map(),  // nom du salon vocal -> Set(fp)
        friends: [], incoming: [], outgoing: [], groups: new Map(), groupRoomKeys: new Map(),
        groupMessages: new Map(), groupPendingCipher: new Map(),
        blocked: [],
        dmThreads: new Map(),
        callState: new Map(),         // fp -> 'ringing-out' | 'ringing-in' | 'in-call'
        unreadChannels: new Map(), unreadVoice: new Map(), unreadDm: new Map(), unreadGroups: new Map(),
        _lastMsgSentAt: 0,
        peerConns: new Map(), pendingIceCandidates: new Map(), groupVoiceMembers: new Map(), connected: false, everConnected: false,
      };
      conns.set(key, c);
      renderRail();
      wireSocket(c, ws);
      return c;
    }

    /* branche les écouteurs sur un WebSocket pour une connexion (nouvelle ou retentée) */
    function wireSocket(c, ws) {
      c.ws = ws;
      ws.addEventListener('open', () => {
        c.everConnected = true;
        ws.send(JSON.stringify({ t: 'hello-init', username: c.myDisplayName || CURRENT.username, pubJwk: CURRENT.publicJwk, avatar: CURRENT.avatar, bio: CURRENT.bio, shareServerList: CURRENT.shareServerList, hiddenServers: CURRENT.hiddenServers, wantType: c.type }));
      });
      ws.addEventListener('message', (ev) => handleServerMessage(c, JSON.parse(ev.data)));
      ws.addEventListener('close', (ev) => {
        c.connected = false;
        if (c.rejectedUsername) return;
        const detail = `code ${ev.code}${ev.reason ? ' — ' + ev.reason : ''}`;
        const text = c.everConnected
          ? `Connexion au serveur perdue (${detail}).`
          : `Impossible de joindre ${c.host}:${c.port} (${detail}). Vérifie que le serveur tourne et que le port est correct.`;
        if (c.type === 'channels') addSystemMessage(c, c.activeChannel, text);
        renderRail();
        if (activeKey === c.key) renderMain();
      });
      ws.addEventListener('error', () => { });
    }

    /* retente une connexion sur un serveur déjà dans la liste mais actuellement injoignable
       (ex: après un redémarrage du serveur) — remplace juste le WebSocket, garde l'historique local */
    function retryConnection(c) {
      if (c.connected || c._retrying) return;
      c._retrying = true;
      c.rejectedUsername = false;
      const ws = new WebSocket(`ws://${c.host}:${c.port}/`);
      wireSocket(c, ws);
      ws.addEventListener('open', () => { c._retrying = false; }, { once: true });
      ws.addEventListener('close', () => { c._retrying = false; }, { once: true });
      ws.addEventListener('error', () => { c._retrying = false; }, { once: true });
    }

    /* bouton "actualiser" : retente tous les serveurs enregistrés qu'on ne capte pas actuellement */
    function refreshAllServers() {
      for (const c of conns.values()) if (!c.connected) retryConnection(c);
      renderRail();
    }

    async function handleServerMessage(c, msg) {
      if (msg.t === 'auth-challenge') {
        // Le serveur ne nous fait pas confiance sur parole : on doit prouver qu'on possède
        // bien la clé privée correspondant à la clé publique qu'on a annoncée, en dérivant
        // un secret ECDH avec sa clé éphémère puis en signant son défi (nonce) par HMAC.
        // Si ce n'est pas fait, le serveur ne nous laissera authentifier sous aucune identité.
        try {
          const serverPub = await crypto.subtle.importKey('jwk', msg.serverEphemeralPub, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
          const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: serverPub }, CURRENT.privateKey, 256);
          const hmacKey = await crypto.subtle.importKey('raw', bits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
          const nonceBytes = Uint8Array.from(atob(msg.nonce), ch => ch.charCodeAt(0));
          const sig = await crypto.subtle.sign('HMAC', hmacKey, nonceBytes);
          const proof = btoa(String.fromCharCode(...new Uint8Array(sig)));
          c.ws.send(JSON.stringify({ t: 'auth-response', proof }));
        } catch (e) {
          addSystemMessage(c, c.activeChannel || 'general', "Échec de l'authentification cryptographique auprès du serveur.");
        }
      } else if (msg.t === 'auth-failed') {
        addSystemMessage(c, c.activeChannel || 'general', "Le serveur a refusé la preuve d'identité. Connexion fermée.");
      } else if (msg.t === 'welcome') {
        c.connected = true;
        c.type = msg.serverType;
        c.name = msg.serverName;
        handleServerCapabilities(c, msg); // détecte un nœud "les deux à la fois" et demande à l'utilisateur
        if (c.type === 'channels') {
          c.role = msg.role;
          c.icon = msg.icon || null;
          c.roles = msg.roles || [];
          c.defaultRoleId = msg.defaultRoleId || 'member';
          c.userRoles = msg.userRoles || {};
          c.onboardingQuiz = msg.onboardingQuiz || null;
          c.myRoles = msg.myRoles || [];
          c.myRoleIds = msg.myRoleIds || [];
          c.maxMessageLength = msg.maxMessageLength || 5000;
          c.channels = msg.channels && msg.channels.length ? msg.channels : ['general'];
          c.voiceChannels = msg.voiceChannels && msg.voiceChannels.length ? msg.voiceChannels : ['Général'];
          c.activeChannel = c.channels.includes(c.activeChannel) ? c.activeChannel : c.channels[0];
          c.channels.forEach(ch => { if (!c.messages[ch]) c.messages[ch] = []; });
          for (const ch of c.channels) await restoreSavedChannelKey(c, ch);
          c.voiceChannelMembers = new Map(Object.entries(msg.voiceChannelRoster || {}).map(([k, v]) => [k, new Set(v)]));
          for (const r of msg.roster) await registerRosterMember(c, r.fingerprint, r.username, r.pubJwk, r.role, r.avatar, false, r.bio, r.shareServerList, r.hiddenServers, r.roles, r.roleIds);
          ensureChannelKey(c, c.activeChannel);
        } else {
          c.role = msg.role || 'member';
          c.icon = msg.icon || null;
          c.friends = msg.friends || [];
          c.incoming = msg.incoming || [];
          c.outgoing = msg.outgoing || [];
          c.blocked = msg.blocked || [];
          c.maxMessageLength = msg.maxMessageLength || 5000;
          (msg.groups || []).forEach(g => c.groups.set(g.id, g));
          c.groupVoiceMembers = new Map(Object.entries(msg.groupVoiceRoster || {}).map(([k, v]) => [k, new Set(v)]));
          for (const f of c.friends) if (f.fingerprint) await registerRosterMember(c, f.fingerprint, f.username, f.pubJwk, null, f.avatar, false, f.bio, f.shareServerList, f.hiddenServers);
          for (const g of (msg.groups || [])) {
            await restoreSavedGroupKey(c, g.id);
            await registerGroupMembersInRoster(c, g);
          }
        }
        renderRail(); renderSidebar(); renderMain();
      } else if (msg.t === 'onboarding-quiz-required') {
        openOnboardingQuizModal(c, msg.quiz);
      } else if (msg.t === 'peer-join') {
        await registerRosterMember(c, msg.fingerprint, msg.username, msg.pubJwk, msg.role, msg.avatar, false, msg.bio, msg.shareServerList, msg.hiddenServers, msg.roles, msg.roleIds);
        // un nouveau membre peut avoir besoin des clés de salon qu'on possède déjà
        for (const [ch, key] of c.roomKeys) {
          const member = c.roster.get(msg.fingerprint);
          if (member && member.pairKey) offerRoomKey(c, msg.fingerprint, 'channel', ch, key);
        }
        renderSidebar();
      } else if (msg.t === 'peer-leave') {
        c.roster.delete(msg.fingerprint);
        for (const [chan, members] of c.voiceChannelMembers) { members.delete(msg.fingerprint); }
        closePeerConn(c, msg.fingerprint);
        renderSidebar(); renderMain();
      } else if (msg.t === 'peer-profile-update') {
        const m = c.roster.get(msg.fingerprint);
        if (m) { m.bio = msg.bio; m.shareServerList = msg.shareServerList; m.hiddenServers = msg.hiddenServers; if (msg.avatar !== undefined) m.avatar = msg.avatar; }
        const f = c.friends.find(x => x.fingerprint === msg.fingerprint);
        if (f) { f.bio = msg.bio; f.shareServerList = msg.shareServerList; f.hiddenServers = msg.hiddenServers; if (msg.avatar !== undefined) f.avatar = msg.avatar; }
        renderSidebar(); renderMessages();
      } else if (msg.t === 'peer-role-update') {
        const m = c.roster.get(msg.fingerprint);
        if (m) {
          m.role = msg.role;
          if (msg.roles) m.roles = msg.roles;
          if (msg.roleIds) m.roleIds = msg.roleIds;
        }
        if (msg.fingerprint === CURRENT.fingerprint) {
          c.role = msg.role;
          if (msg.roles) c.myRoles = msg.roles;
          if (msg.roleIds) c.myRoleIds = msg.roleIds;
        }
        renderSidebar(); renderMain();
      } else if (msg.t === 'roles-update') {
        c.roles = msg.roles || [];
        c.defaultRoleId = msg.defaultRoleId || 'member';
        c.userRoles = msg.userRoles || {};
        if (msg.onboardingQuiz) c.onboardingQuiz = msg.onboardingQuiz;
        renderSidebar(); renderMain();
      } else if (msg.t === 'channels-update') {
        c.channels = msg.channels;
        c.channels.forEach(ch => { if (!c.messages[ch]) c.messages[ch] = []; });
        for (const ch of c.channels) await restoreSavedChannelKey(c, ch);
        if (!c.channels.includes(c.activeChannel)) c.activeChannel = c.channels[0];
        renderSidebar(); renderMain();
      } else if (msg.t === 'voice-channels-update') {
        c.voiceChannels = msg.voiceChannels;
        renderSidebar();
      } else if (msg.t === 'voice-channel-roster') {
        const before = c.voiceChannelMembers.get(msg.channel) || new Set();
        const wasIn = before.has(CURRENT.fingerprint);
        c.voiceChannelMembers.set(msg.channel, new Set(msg.members));
        const isIn = c.voiceChannelMembers.get(msg.channel).has(CURRENT.fingerprint);
        if (isIn && !wasIn) { c.activeVoiceChannel = msg.channel; soundJoinVoice(); }
        if (!isIn && wasIn && c.activeVoiceChannel === msg.channel) { c.activeVoiceChannel = null; soundLeaveVoice(); }
        if (isIn) reconcileVoiceChannelPeers(c, msg.channel);
        renderSidebar(); renderMain();
      } else if (msg.t === 'server-info-update') {
        c.icon = msg.icon || null;
        renderRail(); renderSidebar();
      } else if (msg.t === 'channel-message-ack') {
        const list = c.messages[msg.channel] || [];
        const m = (msg.tempId && list.find(x => x.tempId === msg.tempId)) || [...list].reverse().find(m => m.mine && !m.id && m._iv);
        if (m) { m.id = msg.id; m.pending = false; m.failed = false; }
        renderMessages();
      } else if (msg.t === 'group-message-ack') {
        const list = c.groupMessages.get(msg.groupId) || [];
        const m = (msg.tempId && list.find(x => x.tempId === msg.tempId)) || [...list].reverse().find(m => m.mine && !m.id);
        if (m) { m.id = msg.id; m.pending = false; m.failed = false; }
        renderMessages();
      } else if (msg.t === 'relay-ack') {
        // confirme la remise d'un MP direct (le destinataire était bien en ligne)
        for (const [fp, thread] of c.dmThreads) { if (findByTempId(thread, msg.tempId)) { resolveDmMessage(c, fp, msg.tempId, true); break; } }
      } else if (msg.t === 'message-edited') {
        await applyRemoteEdit(c, msg);
      } else if (msg.t === 'message-deleted') {
        applyRemoteDelete(c, msg);
      } else if (msg.t === 'message-delivered' || msg.t === 'message-read') {
        applyReceiptEvent(c, msg);
      } else if (msg.t === 'message-reaction-update') {
        applyReactionEvent(c, msg);
      } else if (msg.t === 'rate-limited') {
        if (msg.scope === 'channel' && msg.scopeId) resolveChannelMessage(c, msg.scopeId, msg.tempId, false);
        else if (msg.scope === 'group' && msg.scopeId) resolveGroupMessage(c, msg.scopeId, msg.tempId, false);
        else if (msg.tempId) { for (const [fp, thread] of c.dmThreads) { if (findByTempId(thread, msg.tempId)) { resolveDmMessage(c, fp, msg.tempId, false); break; } } }
        addSystemMessage(c, c.activeChannel, "· Trop de messages envoyés trop vite — attends une seconde.");
      } else if (msg.t === 'blocked-user') {
        if (!c.blocked.find(b => b.fingerprint === msg.fingerprint)) c.blocked.push({ fingerprint: msg.fingerprint, username: c.roster.get(msg.fingerprint)?.username || '?' });
        c.friends = c.friends.filter(f => f.fingerprint !== msg.fingerprint);
        if (activeDmFp === msg.fingerprint) activeDmFp = null;
        renderSidebar(); renderMain();
      } else if (msg.t === 'unblocked-user') {
        c.blocked = c.blocked.filter(b => b.fingerprint !== msg.fingerprint);
        renderMain();
      } else if (msg.t === 'friend-removed') {
        c.friends = c.friends.filter(f => f.fingerprint !== msg.fingerprint);
        if (activeDmFp === msg.fingerprint) activeDmFp = null;
        renderSidebar(); renderMain();
      } else if (msg.t === 'group-updated') {
        c.groups.set(msg.group.id, msg.group);
        await registerGroupMembersInRoster(c, msg.group);
        if (!c.groupRoomKeys.has(msg.group.id)) await restoreSavedGroupKey(c, msg.group.id);
        if (c.groupRoomKeys.has(msg.group.id)) {
          // la liste des membres a changé (ex: quelqu'un vient d'être ajouté) -> si on a la clé,
          // on la repousse à tout le monde ; sans effet pour ceux qui l'ont déjà (juste redondant)
          for (const m of msg.group.members) {
            if (m.fingerprint === CURRENT.fingerprint) continue;
            const rosterEntry = c.roster.get(m.fingerprint);
            if (rosterEntry && rosterEntry.pairKey) offerRoomKey(c, m.fingerprint, 'group', msg.group.id, c.groupRoomKeys.get(msg.group.id));
          }
        }
        renderSidebar(); renderMain();
      } else if (msg.t === 'group-removed') {
        c.groups.delete(msg.groupId);
        c.groupMessages.delete(msg.groupId);
        c.groupRoomKeys.delete(msg.groupId);
        await forgetSavedGroupKey(msg.groupId);
        if (activeGroupId === msg.groupId) { activeGroupId = null; }
        renderSidebar(); renderMain();
      } else if (msg.t === 'kicked') {
        window.alert(`Tu as été expulsé par ${msg.by || 'un admin'}. Le serveur a été retiré de ta liste.`);
        removeServerFromList(c);
      } else if (msg.t === 'banned') {
        window.alert('Tu as été banni de ce serveur. Il a été retiré de ta liste.');
        removeServerFromList(c);
      } else if (msg.t === 'relay') {
        await handleRelayPayload(c, msg.from, msg.payload);
      } else if (msg.t === 'channel-relay') {
        await handleChannelCipher(c, msg.channel, { id: msg.id, from: msg.from, iv: msg.iv, ct: msg.ct, ts: msg.ts });
        if (activeKey === c.key && !activeDmFp && !activeGroupId && c.activeChannel === msg.channel) renderMessages();
      } else if (msg.t === 'channel-history') {
        for (const entry of msg.messages) await handleChannelCipher(c, msg.channel, entry);
        if (!c.roomKeys.has(msg.channel)) scheduleRoomKeyRecovery(c, msg.channel, 3000);
        renderMessages();
      } else if (msg.t === 'group-relay') {
        await handleGroupCipher(c, msg.groupId, { id: msg.id, from: msg.from, iv: msg.iv, ct: msg.ct, ts: msg.ts });
        if (activeKey === c.key && activeGroupId === msg.groupId) renderMessages();
      } else if (msg.t === 'group-history') {
        for (const entry of msg.messages) await handleGroupCipher(c, msg.groupId, entry, true);
        if (!c.groupRoomKeys.has(msg.groupId)) scheduleGroupKeyRecovery(c, msg.groupId, 3000);
        renderMessages();
      } else if (msg.t === 'group-voice-roster') {
        const before = c.groupVoiceMembers.get(msg.groupId) || new Set();
        const wasEmpty = before.size === 0;
        const iWasIn = before.has(CURRENT.fingerprint);
        c.groupVoiceMembers.set(msg.groupId, new Set(msg.members));
        const now = c.groupVoiceMembers.get(msg.groupId);
        const iAmIn = now.has(CURRENT.fingerprint);
        if (iAmIn && !iWasIn) soundJoinVoice();
        if (!iAmIn && iWasIn) soundLeaveVoice();
        if (wasEmpty && now.size > 0 && !iAmIn) {
          // quelqu'un vient de démarrer le vocal du groupe et on n'y est pas -> ça sonne comme un appel
          const group = c.groups.get(msg.groupId);
          const starterFp = [...now][0];
          const starterName = c.roster.get(starterFp)?.username || '?';
          notifyUser(`Vocal démarré dans ${group?.name || 'un groupe'}`, `${starterName} a rejoint le vocal.`);
          soundRingStart();
          showGroupCallBanner(c, msg.groupId, group?.name || 'Groupe', starterName);
        }
        if (now.size === 0) hideGroupCallBanner(msg.groupId);
        if (iAmIn) hideGroupCallBanner(msg.groupId);
        reconcileGroupVoicePeers(c, msg.groupId); // continue même si on regarde autre chose, comme un vrai vocal
        renderSidebar(); renderMain();
      } else if (msg.t === 'group-created') {
        c.groups.set(msg.group.id, msg.group);
        await registerGroupMembersInRoster(c, msg.group);
        if (c._justCreatedGroupKey && !c.groupRoomKeys.has(msg.group.id)) {
          // c'est l'écho de notre propre création de groupe : on active la clé qu'on vient de générer
          c.groupRoomKeys.set(msg.group.id, c._justCreatedGroupKey);
          await rememberRoomKey('group', msg.group.id, c._justCreatedGroupKey);
          c._justCreatedGroupKey = null;
        } else {
          await restoreSavedGroupKey(c, msg.group.id);
        }
        if (c.groupRoomKeys.has(msg.group.id)) {
          // on a déjà la clé (créateur, ou membre existant à qui on vient d'ajouter quelqu'un)
          // -> on l'offre tout de suite à tout membre qui ne l'aurait pas encore
          for (const m of msg.group.members) {
            if (m.fingerprint === CURRENT.fingerprint) continue;
            const rosterEntry = c.roster.get(m.fingerprint);
            if (rosterEntry && rosterEntry.pairKey) offerRoomKey(c, m.fingerprint, 'group', msg.group.id, c.groupRoomKeys.get(msg.group.id));
          }
        }
        renderSidebar(); renderMain();
      } else if (msg.t === 'search-results') {
        c._searchResults = msg.results;
        c._searchDone = true;
        if (activeKey === c.key) renderMain();
      } else if (msg.t === 'friend-request-sent') {
        c.outgoing.push({ from: CURRENT.fingerprint, to: msg.to, toUsername: msg.username });
        renderMain();
      } else if (msg.t === 'friend-request-incoming') {
        c.incoming.push({ from: msg.from, fromUsername: msg.username });
        notifyUser(`Demande d'ami de ${msg.username}`, `sur ${c.name}`);
        renderRail(); renderMain();
      } else if (msg.t === 'friend-added') {
        c.friends.push({ fingerprint: msg.fingerprint, username: msg.username, pubJwk: msg.pubJwk || null, online: true });
        c.incoming = c.incoming.filter(r => r.from !== msg.fingerprint);
        c.outgoing = c.outgoing.filter(r => r.to !== msg.fingerprint);
        await registerRosterMember(c, msg.fingerprint, msg.username, msg.pubJwk, null, null, true);
        renderRail(); renderMain();
      } else if (msg.t === 'friend-declined') {
        c.outgoing = c.outgoing.filter(r => r.to !== msg.fingerprint);
        renderMain();
      } else if (msg.t === 'friend-online') {
        const f = c.friends.find(x => x.fingerprint === msg.fingerprint);
        if (f) f.online = true;
        for (const g of c.groups.values()) {
          const m = (g.members || []).find(x => (x.fingerprint || x) === msg.fingerprint);
          if (m && typeof m === 'object') m.online = true;
          if (c.groupRoomKeys.has(g.id)) {
            let rosterEntry = c.roster.get(msg.fingerprint);
            if (!rosterEntry || !rosterEntry.pairKey) {
              const gm = (g.members || []).find(x => (x.fingerprint || x) === msg.fingerprint);
              if (gm && gm.pubJwk) {
                registerRosterMember(c, msg.fingerprint, gm.username, gm.pubJwk, null, gm.avatar).then(() => {
                  const entry = c.roster.get(msg.fingerprint);
                  if (entry && entry.pairKey && c.groupRoomKeys.has(g.id)) {
                    offerRoomKey(c, msg.fingerprint, 'group', g.id, c.groupRoomKeys.get(g.id));
                  }
                });
              }
            } else {
              offerRoomKey(c, msg.fingerprint, 'group', g.id, c.groupRoomKeys.get(g.id));
            }
          }
        }
        renderMain();
      } else if (msg.t === 'friend-offline') {
        const f = c.friends.find(x => x.fingerprint === msg.fingerprint);
        if (f) f.online = false;
        for (const g of c.groups.values()) {
          const m = (g.members || []).find(x => (x.fingerprint || x) === msg.fingerprint);
          if (m && typeof m === 'object') m.online = false;
        }
        renderMain();
      } else if (msg.t === 'username-taken') {
        await handleUsernameTaken(c);
      } else if (msg.t === 'error') {
        if (msg.tempId) {
          let resolved = false;
          if (!activeDmFp && !activeGroupId && c.messages[c.activeChannel]) { resolveChannelMessage(c, c.activeChannel, msg.tempId, false); resolved = true; }
          if (activeGroupId && c.groupMessages.has(activeGroupId)) { resolveGroupMessage(c, activeGroupId, msg.tempId, false); resolved = true; }
          if (!resolved) for (const [fp, thread] of c.dmThreads) { if (findByTempId(thread, msg.tempId)) { resolveDmMessage(c, fp, msg.tempId, false); break; } }
        }
        addSystemMessage(c, c.activeChannel || 'general', `Erreur : ${msg.message}`);
      }
    }

    async function handleUsernameTaken(c) {
      c.rejectedUsername = true;
      const suggestion = `${c.myDisplayName || CURRENT.username}_2`;
      const displayName = window.prompt(
        `Le pseudo "${c.myDisplayName || CURRENT.username}" est déjà utilisé sur CE serveur.\nChoisis un nom d'affichage différent — uniquement pour ce serveur (ton pseudo global ne change pas ailleurs) :`,
        suggestion
      );
      if (displayName === null) return;
      const finalDisplayName = displayName.trim() || suggestion;
      const host = c.host, port = c.port, label = c.label, type = c.type;

      // Enregistre durablement le pseudo pour CE serveur précis afin de ne plus le redemander à la réouverture
      const list = myServerList();
      const entry = list.find(s => s.host === host && String(s.port) === String(port) && s.kindHint === type);
      if (entry) {
        entry.myDisplayName = finalDisplayName;
        persistMyServerList(list);
      } else {
        addServerToList(host, port, label, type, finalDisplayName);
      }

      c.ws.close();
      conns.delete(c.key);
      const next = await connectToServer(host, port, label, type, finalDisplayName);
      selectServer(next.key);
    }

    async function registerRosterMember(c, fp, username, pubJwk, role, avatar, _unused, bio, shareServerList, hiddenServers, roles, roleIds) {
      const existing = c.roster.get(fp);
      if (existing && existing.pairKey) {
        existing.username = username || existing.username;
        existing.avatar = avatar !== undefined ? avatar : existing.avatar;
        if (bio !== undefined) existing.bio = bio;
        if (shareServerList !== undefined) existing.shareServerList = shareServerList;
        if (hiddenServers !== undefined) existing.hiddenServers = hiddenServers;
        if (roles !== undefined) existing.roles = roles;
        if (roleIds !== undefined) existing.roleIds = roleIds;
        return;
      }
      let pubKey = null, pairKey = null;
      if (pubJwk) { pubKey = await importPub(pubJwk); pairKey = await derivePairwiseKey(CURRENT.privateKey, pubKey); }
      c.roster.set(fp, {
        username, pubJwk, pubKey, pairKey, role: role || 'member', avatar: avatar || null,
        bio: bio || '', shareServerList: shareServerList !== false, hiddenServers: hiddenServers || [],
        roles: roles || [], roleIds: roleIds || []
      });
    }
    async function registerGroupMembersInRoster(c, group) {
      // Le partage de la clé de groupe repose sur une clé pair-à-pair avec CHAQUE membre,
      // pas seulement avec nos propres amis (deux membres d'un groupe ne sont pas forcément
      // amis entre eux). Sans ça, un membre ajouté par quelqu'un d'autre ne recevait jamais
      // la clé car personne n'avait de quoi la lui chiffrer.
      for (const m of group.members || []) {
        if (m.fingerprint === CURRENT.fingerprint) continue;
        if (m.pubJwk) await registerRosterMember(c, m.fingerprint, m.username, m.pubJwk, null, m.avatar);
      }
    }

    function sendRelay(c, toFp, payload) { if (c.ws && c.ws.readyState === WebSocket.OPEN) c.ws.send(JSON.stringify({ t: 'relay', to: toFp, payload })); }
    function sendRelayAll(c, payload) { if (c.ws && c.ws.readyState === WebSocket.OPEN) c.ws.send(JSON.stringify({ t: 'relay-all', payload })); }

    async function handleRelayPayload(c, fromFp, payload) {
      let member = c.roster.get(fromFp);
      if (payload.kind === 'key-request') {
        // quelqu'un cherche la clé d'un salon/groupe : si je l'ai, je la lui transmets (chiffrée pour lui)
        if (!member || !member.pairKey) return;
        if (payload.scope === 'channel') {
          if (!c.roomKeys.has(payload.scopeId)) await restoreSavedChannelKey(c, payload.scopeId);
          if (c.roomKeys.has(payload.scopeId)) {
            offerRoomKey(c, fromFp, 'channel', payload.scopeId, c.roomKeys.get(payload.scopeId));
          }
        } else if (payload.scope === 'group') {
          if (!c.groupRoomKeys.has(payload.scopeId)) await restoreSavedGroupKey(c, payload.scopeId);
          if (c.groupRoomKeys.has(payload.scopeId)) {
            const group = c.groups.get(payload.scopeId);
            if (!group || group.members.some(m => (m.fingerprint || m) === fromFp)) {
              offerRoomKey(c, fromFp, 'group', payload.scopeId, c.groupRoomKeys.get(payload.scopeId));
            }
          }
        }
        return;
      }
      if (payload.kind === 'room-key') {
        if (!member || !member.pairKey) return;
        const rawB64 = await aesDecrypt(member.pairKey, payload.iv, payload.ct);
        const key = await importRoomKeyB64(rawB64);
        if (payload.scope === 'channel') {
          c.roomKeys.set(payload.scopeId, key);
          await rememberRoomKey('channel', payload.scopeId, key, c.host + ':' + c.port);
          await flushPendingCipher(c, payload.scopeId);
        } else {
          c.groupRoomKeys.set(payload.scopeId, key);
          await rememberRoomKey('group', payload.scopeId, key);
          await flushGroupPendingCipher(c, payload.scopeId);
        }
        renderMessages();
        return;
      }
      if (payload.kind === 'video-stream-info') {
        handleVideoStreamInfo(c, fromFp, payload);
        return;
      }
      if (payload.kind === 'video-stream-stopped') {
        handleVideoStreamStopped(c, fromFp, payload);
        return;
      }
      if (!member || !member.pairKey) return;
      if (payload.kind === 'chat') {
        const rawText = await aesDecrypt(member.pairKey, payload.iv, payload.ct);
        const { replyTo, cleanText } = parseMessageReply(rawText);
        pushDmMessage(c, fromFp, {
          id: payload.id || payload.tempId || genTempId(),
          from: fromFp,
          author: member.username,
          avatar: member.avatar,
          text: cleanText,
          replyTo,
          ts: Date.now(),
          mine: false,
          reactions: payload.reactions || {}
        });

        const thread = c.dmThreads.get(fromFp) || [];
        const m = thread.find(x => x.id === payload.msgId || x.tempId === payload.msgId);
        if (m) {
          if (!m.reactions) m.reactions = {};
          if (!Array.isArray(m.reactions[payload.emoji])) m.reactions[payload.emoji] = [];
          const idx = m.reactions[payload.emoji].indexOf(fromFp);
          if (idx !== -1) {
            m.reactions[payload.emoji].splice(idx, 1);
            if (m.reactions[payload.emoji].length === 0) delete m.reactions[payload.emoji];
          } else {
            m.reactions[payload.emoji].push(fromFp);
          }

        }
      } else if (payload.kind === 'webrtc-signal') {
        await handleWebrtcSignal(c, fromFp, payload);
      } else if (payload.kind === 'call-invite') {
        c.callState.set(fromFp, 'ringing-in');
        soundRingStart();
        notifyUser(`Appel de ${member.username}`, 'Appuie pour répondre.');
        showIncomingCallBanner(c, fromFp, member.username, member.avatar);
        renderMain();
      } else if (payload.kind === 'call-accept') {

        renderMain();
      } else if (payload.kind === 'call-decline') {
        soundRingStop(); hideIncomingCallBanner();
        c.callState.delete(fromFp);
        addSystemMessage2DM(c, fromFp, `${member.username} a refusé l'appel.`);
        renderMain();
      } else if (payload.kind === 'call-cancel') {
        soundRingStop(); hideIncomingCallBanner();
        c.callState.delete(fromFp);
        renderMain();

    function addSystemMessage2DM(c, fp, text) { pushDmMessage(c, fp, { system: true, text, ts: Date.now() }); }

    async function offerRoomKey(c, toFp, scope, scopeId, key) {
      const member = c.roster.get(toFp);
      if (!member || !member.pairKey) return;
      const rawB64 = await exportRoomKeyB64(key);
      const { iv, ct } = await aesEncrypt(member.pairKey, rawB64);
      sendRelay(c, toFp, { kind: 'room-key', scope, scopeId, iv, ct });
    }

    /* ================= SALONS — clé de salon partagée + historique persisté ================= */
    async function ensureChannelKey(c, channel) {
      if (c.roomKeys.has(channel)) return c.roomKeys.get(channel);
      await restoreSavedChannelKey(c, channel);
      if (c.roomKeys.has(channel)) return c.roomKeys.get(channel);
      if (c.keyRequested.has(channel)) return null;
      if (!c.ws || c.ws.readyState !== WebSocket.OPEN) {
        // connexion pas encore prête : on retente dès qu'elle s'ouvre, sans marquer "déjà demandé"
        if (c.ws) c.ws.addEventListener('open', () => ensureChannelKey(c, channel), { once: true });
        return null;
      }
      c.keyRequested.add(channel);
      sendRelayAll(c, { kind: 'key-request', scope: 'channel', scopeId: channel });
      c.ws.send(JSON.stringify({ t: 'get-channel-history', channel }));
      return null;
    }
    /* Si personne ne connaît encore la clé, le membre en ligne dont l'empreinte est

       indéchiffrables : c'est le prix nécessaire pour préserver le chiffrement. */
    function scheduleRoomKeyRecovery(c, channel, delay) {
      if (!c._roomRecoveryTimers) c._roomRecoveryTimers = new Set();
      if (c._roomRecoveryTimers.has(channel)) return;
      c._roomRecoveryTimers.add(channel);
      setTimeout(async () => {
        c._roomRecoveryTimers.delete(channel);
        if (c.roomKeys.has(channel)) return;
        await restoreSavedChannelKey(c, channel);
        if (c.roomKeys.has(channel)) { if (activeKey === c.key) renderMessages(); return; }
        const leader = [CURRENT.fingerprint, ...c.roster.keys()].sort()[0] === CURRENT.fingerprint;
        if (!c.roomKeys.has(channel) && leader) {
          const newKey = await generateRoomKey();
          c.roomKeys.set(channel, newKey);
          await rememberRoomKey('channel', channel, newKey, c.host + ':' + c.port);
          for (const [fp, member] of c.roster) {
            if (member.pairKey) await offerRoomKey(c, fp, 'channel', channel, newKey);
          }
          await flushPendingCipher(c, channel);
          addSystemMessage(c, channel, "⚿ Nouvelle clé de salon créée : les nouveaux messages sont disponibles, mais l'ancien historique reste verrouillé.");
          if (activeKey === c.key) renderMessages();

    }
    async function handleChannelCipher(c, channel, entry) {
      if (!c.messages[channel]) c.messages[channel] = [];
      const key = c.roomKeys.get(channel);
      if (!key) {
        if (!c.pendingCipher.has(channel)) c.pendingCipher.set(channel, []);
        const bucket = c.pendingCipher.get(channel);
        if (!bucket.find(e => e.iv === entry.iv && e.ct === entry.ct)) bucket.push(entry);
        return;

    async function decryptAndStoreChannelMsg(c, channel, entry, key) {

        const member = c.roster.get(entry.from);
        const mine = entry.from === CURRENT.fingerprint;
        const already = c.messages[channel].find(m => m.id && entry.id && m.id === entry.id);
        if (already) return;
        c.messages[channel].push({
          id: entry.id || null, from: entry.from,
          author: mine ? (c.myDisplayName || CURRENT.username) : (member?.username || '?'),
          avatar: mine ? CURRENT.avatar : (member?.avatar || null),
          text: cleanText, replyTo, ts: entry.ts || Date.now(), mine, _iv: entry.iv, _ct: entry.ct,
          deliveredTo: entry.deliveredTo || [], readBy: entry.readBy || [],
          reactions: entry.reactions || {}
        });
        c.messages[channel].sort((a, b) => (a.ts || 0) - (b.ts || 0));
        if (!mine && messageMentionsMe(cleanText) && (Date.now() - (entry.ts || 0)) < 8000) notifyUser(`${member?.username || '?'} vous mentionne dans #${channel}`, cleanText);
        const viewingThis = activeKey === c.key && !activeDmFp && !activeGroupId && c.activeChannel === channel && document.hasFocus();
        if (!mine && (Date.now() - (entry.ts || 0)) < 8000 && !viewingThis) bumpUnread(c.unreadChannels, channel);
        if (!mine && entry.id && (Date.now() - (entry.ts || 0)) < 8000) sendReceipt(c, viewingThis ? 'mark-read' : 'mark-delivered', 'channel', channel, entry.id);

    async function flushPendingCipher(c, channel) {

    async function sendChannelMessage(c, channel, text) {

          const t0 = Date.now();
          const iv = setInterval(() => {
            if (c.roomKeys.has(channel) || Date.now() - t0 > 4200) { clearInterval(iv); resolve(c.roomKeys.get(channel) || null); }
          }, 100);
        });

          if (c.role === 'owner') {
            // dernier recours : le propriétaire peut légitimement amorcer la clé de ce salon
            key = await generateRoomKey();
            c.roomKeys.set(channel, key);
            await rememberRoomKey('channel', channel, key, c.host + ':' + c.port);
            await flushPendingCipher(c, channel);
          } else {
            addSystemMessage(c, channel, "⚿ En attente de la clé de ce salon (aucun membre qui la connaît n'est en ligne) — réessaie dans un instant, ou demande au propriétaire du serveur de se connecter.");
            return;
          }

      let replyMeta = null;
      if (CURRENT_REPLY) {
        replyMeta = { id: CURRENT_REPLY.id, author: CURRENT_REPLY.author, snippet: CURRENT_REPLY.snippet, from: CURRENT_REPLY.from };
        outText = `[REPLY:${JSON.stringify(replyMeta)}]\n` + text;
      }
      const { iv, ct } = await aesEncrypt(key, outText);
      const tempId = genTempId();
      c.messages[channel].push({ id: null, tempId, pending: true, failed: false, from: CURRENT.fingerprint, author: c.myDisplayName || CURRENT.username, avatar: CURRENT.avatar, text, replyTo: replyMeta, ts: Date.now(), mine: true, _iv: iv, _ct: ct, reactions: {} });
      if (activeKey === c.key && !activeDmFp && !activeGroupId && c.activeChannel === channel) renderMessages();

    function genTempId() { return 'tmp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
    /* retrouve un message local par tempId (envoi en cours) dans un salon/groupe/MP donné et le marque échoué ou confirmé */
    function findByTempId(list, tempId) { return (list || []).find(m => m.tempId === tempId && m.pending); }

      const m = findByTempId(c.messages[channel], tempId);

      m.pending = false;
      if (!ok) m.failed = true;
      if (activeKey === c.key && !activeDmFp && !activeGroupId && c.activeChannel === channel) renderMessages();
    }
    function resolveGroupMessage(c, groupId, tempId, ok) {
      const m = findByTempId(c.groupMessages.get(groupId), tempId);
      if (!m) return;
      m.pending = false;
      if (!ok) m.failed = true;
      if (activeKey === c.key && activeGroupId === groupId) renderMessages();
    }
    function resolveDmMessage(c, fp, tempId, ok) {
      const m = findByTempId(c.dmThreads.get(fp), tempId);
      if (!m) return;
      m.pending = false;
      if (!ok) m.failed = true;
      if (activeKey === c.key && activeDmFp === fp) renderMessages();
    }
    function addSystemMessage(c, channel, text) {
      if (!c.messages[channel]) c.messages[channel] = [];
      c.messages[channel].push({ system: true, text, ts: Date.now() });
      if (activeKey === c.key && !activeDmFp && !activeGroupId && c.activeChannel === channel) renderMessages();
    }

    /* ================= GROUPES MP — même principe que les salons ================= */
    async function handleGroupCipher(c, groupId, entry, isHistory) {
      if (!c.groupMessages.has(groupId)) c.groupMessages.set(groupId, []);
      const key = c.groupRoomKeys.get(groupId);
      if (!key) {
        if (!c.groupPendingCipher.has(groupId)) c.groupPendingCipher.set(groupId, []);
        c.groupPendingCipher.get(groupId).push(entry);
        if (!c._groupKeyReqSent) c._groupKeyReqSent = new Set();
        if (!c._groupKeyReqSent.has(groupId)) {
          c._groupKeyReqSent.add(groupId);
          sendRelayAll(c, { kind: 'key-request', scope: 'group', scopeId: groupId });
        }
        return;
      }
      await decryptAndStoreGroupMsg(c, groupId, entry, key);
    }
    async function decryptAndStoreGroupMsg(c, groupId, entry, key) {
      try {
        const rawText = await aesDecrypt(key, entry.iv, entry.ct);
        const { replyTo, cleanText } = parseMessageReply(rawText);
        const group = c.groups.get(groupId);
        const memberInfo = group && group.members.find(m => m.fingerprint === entry.from);
        const mine = entry.from === CURRENT.fingerprint;
        const list = c.groupMessages.get(groupId);
        if (list.find(m => m.id && entry.id && m.id === entry.id)) return;
        list.push({
          id: entry.id || null, from: entry.from,
          author: mine ? (c.myDisplayName || CURRENT.username) : (memberInfo?.username || '?'),
          avatar: mine ? CURRENT.avatar : (memberInfo?.avatar || null),
          text: cleanText, replyTo, ts: entry.ts || Date.now(), mine, _iv: entry.iv, _ct: entry.ct,
          deliveredTo: entry.deliveredTo || [], readBy: entry.readBy || [],
          reactions: entry.reactions || {}
        });
        list.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        const viewingThis = activeKey === c.key && activeGroupId === groupId && document.hasFocus();
        if (!mine && (Date.now() - (entry.ts || 0)) < 8000) {
          if (messageMentionsMe(cleanText)) notifyUser(`${memberInfo?.username || '?'} vous mentionne dans ${group?.name || 'un groupe'}`, cleanText);
          else notifyUser(`${memberInfo?.username || '?'} (${group?.name || 'groupe'})`, cleanText);
          if (!viewingThis) bumpUnread(c.unreadGroups, groupId);
        }
        if (!mine && entry.id && (Date.now() - (entry.ts || 0)) < 8000) sendReceipt(c, viewingThis ? 'mark-read' : 'mark-delivered', 'group', groupId, entry.id);
      } catch (e) { }
    }
    /* ---- accusés de réception / lecture ---- */
    function sendReceipt(c, kind, scope, scopeId, id) {
      if (c.ws && c.ws.readyState === WebSocket.OPEN) c.ws.send(JSON.stringify({ t: kind, scope, scopeId, id }));
    }
    function applyReceiptEvent(c, msg) {
      const list = msg.scope === 'channel' ? (c.messages[msg.scopeId] || []) : (c.groupMessages.get(msg.scopeId) || []);
      const m = list.find(x => x.id === msg.id);
      if (!m) return;
      const field = msg.t === 'message-read' ? 'readBy' : 'deliveredTo';
      if (!Array.isArray(m[field])) m[field] = [];
      if (!m[field].includes(msg.fingerprint)) m[field].push(msg.fingerprint);
      if (msg.t === 'message-read') {
        if (!Array.isArray(m.deliveredTo)) m.deliveredTo = [];
        if (!m.deliveredTo.includes(msg.fingerprint)) m.deliveredTo.push(msg.fingerprint);
      }
      if (m.mine) renderMessages(); // seule l'expéditrice/expéditeur affiche les coches de suivi
    }

    function applyReactionEvent(c, msg) {
      const list = msg.scope === 'channel' ? (c.messages[msg.scopeId] || []) : (c.groupMessages.get(msg.scopeId) || []);
      const m = list.find(x => x.id === msg.id);
      if (!m) return;
      m.reactions = msg.reactions || {};
      const isViewing = activeKey === c.key && (
        (msg.scope === 'channel' && !activeDmFp && !activeGroupId && c.activeChannel === msg.scopeId) ||
        (msg.scope === 'group' && activeGroupId === msg.scopeId)
      );

    function toggleMessageReaction(c, scope, scopeId, msgId, emoji) {

        const m = thread.find(x => x.id === msgId || x.tempId === msgId);
        if (!m) return;
        if (!m.reactions) m.reactions = {};
        if (!Array.isArray(m.reactions[emoji])) m.reactions[emoji] = [];
        const myFp = CURRENT.fingerprint;
        const idx = m.reactions[emoji].indexOf(myFp);
        if (idx !== -1) {
          m.reactions[emoji].splice(idx, 1);
          if (m.reactions[emoji].length === 0) delete m.reactions[emoji];
        } else {
          m.reactions[emoji].push(myFp);
        }
        sendRelay(c, scopeId, { kind: 'dm-reaction', msgId, emoji });

      } else {
        const list = (scope === 'channel') ? (c.messages[scopeId] || []) : (c.groupMessages.get(scopeId) || []);
        const m = list.find(x => x.id === msgId || x.tempId === msgId);
        if (m) {
          if (!m.reactions) m.reactions = {};
          if (!Array.isArray(m.reactions[emoji])) m.reactions[emoji] = [];

    function markVisibleMessagesRead(c) {

      if (!activeDmFp && !activeGroupId) { list = c.messages[c.activeChannel]; scope = 'channel'; scopeId = c.activeChannel; }
      else if (activeGroupId) { list = c.groupMessages.get(activeGroupId); scope = 'group'; scopeId = activeGroupId; }

    function scheduleGroupKeyRecovery(c, groupId, delay) {

        if (c.groupRoomKeys.has(groupId)) return;

        if (c.groupRoomKeys.has(groupId)) {

          .filter(m => {

            if (fp === CURRENT.fingerprint) return true;

    /* ================= MP 1-à-1 — direct, non stocké ================= */
    async function sendDmMessage(c, toFp, text) {

      pushDmMessage(c, toFp, { id: tempId, from: CURRENT.fingerprint, author: c.myDisplayName || CURRENT.username, avatar: CURRENT.avatar, text, replyTo: replyMeta, ts: Date.now(), mine: true, tempId, pending: true, failed: false, reactions: {} });
      sendRelay(c, toFp, { kind: 'chat', dm: true, id: tempId, iv, ct, tempId });

      // on grise le message (couvre le cas d'un ami hors ligne, ou d'un blocage silencieux côté serveur)
      setTimeout(() => { resolveDmMessage(c, toFp, tempId, false); }, 8000);
    }
    function pushDmMessage(c, fp, m) {

    /* ================= VOCAL + PARTAGE D'ÉCRAN ================= */
    function loadAudioSettings() {

      catch (e) { return { noiseSuppression: true }; }

    function saveAudioSettings(s) { localStorage.setItem('mesh-audio-settings', JSON.stringify(s)); }
    let audioSettings = loadAudioSettings();
    function micConstraints() {
      return { audio: { echoCancellation: true, autoGainControl: true, noiseSuppression: audioSettings.noiseSuppression } };
    }
    async function setNoiseSuppression(enabled) {

      if (!localStream) return;
      // il faut ré-acquérir le micro avec les nouvelles contraintes et remplacer la piste

          }
        }
        if (oldTrack) { localStream.removeTrack(oldTrack); oldTrack.stop(); }
        localStream.addTrack(newTrack);
        attachSpeakingDetector(CURRENT.fingerprint, localStream, true);
      } catch (e) { }
    }
    async function ensureLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia(micConstraints());
        localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
        attachSpeakingDetector(CURRENT.fingerprint, localStream);
      }
