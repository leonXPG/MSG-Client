<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSG — Messagerie Décentralisée</title>
  <style>
    :root {
      --bg: #0a0d13;
      --bg-raised: #10141d;
      --bg-panel: #131822;
      --line: #1f2632;
      --text: #dbe2ee;
      --text-dim: #7c8797;
      --signal: #4fe0c4;
      --signal-dim: #245c53;
      --alert: #ff7a45;
      --alert-dim: #5a3a2a;
      --danger: #ff5c72;
      --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
      --font-body: 'Manrope', 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    button {
      font-family: var(--font-body);
      cursor: pointer;
    }

    input,
    textarea,
    select {
      font-family: var(--font-mono);
    }

    .hidden {
      display: none !important;
    }

    /* Password input with toggle */
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-wrap input {
      width: 100%;
      padding-right: 42px !important;
    }

    .toggle-password-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-dim);
      padding: 4px 6px;
      border-radius: 4px;
      transition: color .15s;
    }

    .toggle-password-btn:hover {
      color: var(--signal);
    }

    /* Discord-inspired neon enhancements */
    .rail-item {
      transition: border-radius .2s, box-shadow .2s, border-color .2s;
      position: relative;
    }

    .rail-item::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 0;
      background: var(--signal);
      border-radius: 0 4px 4px 0;
      transition: height .2s cubic-bezier(0.4, 0, 0.2, 1), opacity .2s;
      opacity: 0;
    }

    .rail-item:hover::before {
      height: 20px;
      opacity: .75;
    }

    .rail-item.active::before {
      height: 36px;
      opacity: 1;
      box-shadow: 0 0 10px var(--signal);
    }

    .rail-item.active {
      box-shadow: 0 0 16px rgba(79, 224, 196, 0.3);
      border-color: var(--signal);
    }

    .channel-role-tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      margin-left: 6px;
      font-weight: 700;
    }

    /* Image messages & Lightbox */
    .msg-img-wrap {
      margin-top: 8px;
      max-width: 440px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      transition: border-color .2s, box-shadow .2s;
    }

    .msg-img-wrap:hover {
      border-color: var(--signal-dim);
      box-shadow: 0 0 14px rgba(79, 224, 196, 0.25);
    }

    .msg-img-attachment {
      display: block;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      cursor: pointer;
      border-radius: 8px;
    }

    .msg-img-caption {
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text);
      border-top: 1px solid var(--line);
      background: var(--bg-panel);
    }

    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }

    .lightbox-img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--signal-dim);
    }

    /* Quiz option cards */
    .quiz-option-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-raised);
      cursor: pointer;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }

    .quiz-option-card:hover {
      border-color: var(--signal-dim);
      background: var(--bg-panel);
    }

    .quiz-option-card.selected {
      border-color: var(--signal);
      background: rgba(79, 224, 196, 0.08);
      box-shadow: 0 0 12px rgba(79, 224, 196, 0.25);
    }

    /* Video stream tiles */
    .screen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      padding: 12px 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      max-height: 48vh;
      overflow-y: auto;
    }

    .screen-tile {
      position: relative;
      background: #05070b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .2s, box-shadow .2s;
    }

    .screen-tile:hover {
      border-color: var(--signal-dim);
      box-shadow: 0 0 16px rgba(79, 224, 196, 0.25);
    }

    .screen-tile.local-tile {
      border-color: rgba(79, 224, 196, 0.4);
    }

    .screen-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .screen-tile .label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 11px;
      color: #fff;
      background: rgba(10, 13, 19, 0.78);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* AUTH */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .auth-card {
      width: 380px;
      max-width: 92vw;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 36px;
      position: relative;
      box-sizing: border-box;
    }

    .auth-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--signal);
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    h1.auth-title {
      font-family: var(--font-display);
      font-size: 26px;
      margin: 0 0 4px;
      font-weight: 600;
    }

    .auth-sub {
      color: var(--text-dim);
      font-size: 13px;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 18px;
    }

    .auth-tab {
      flex: 1;
      padding: 9px;
      border: none;
      background: none;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--signal);
      color: #04211c;
    }

    .auth-existing-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .acct-chip {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: var(--bg-raised);
    }

    .acct-chip .acct-pick {
      padding: 6px 12px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 12.5px;
      cursor: pointer;
    }

    .acct-chip .acct-pick:hover,
    .acct-chip .acct-pick.picked {
      color: var(--signal);
    }

    .acct-chip .acct-del {
      padding: 6px 10px;
      border: none;
      border-left: 1px solid var(--line);
      background: none;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
    }

    .acct-chip .acct-del:hover {
      color: var(--danger);
      background: var(--alert-dim);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 11px 12px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--signal);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
      margin: -2px 0 4px;
    }

    .remember-row input {
      margin: 0;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--signal);
      color: #04211c;
      font-weight: 700;
      font-size: 14px;
      margin-top: 8px;
      cursor: pointer;
    }

    .btn-ghost {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 10px;
      cursor: pointer;
    }

    .btn-ghost:hover {
      border-color: var(--signal);
      color: var(--signal);
    }

    .auth-error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 10px;
      min-height: 14px;
    }

    .auth-foot {
      margin-top: 18px;
      font-size: 10.5px;
      color: var(--text-dim);
      line-height: 1.5;
      font-family: var(--font-mono);
      opacity: .6;
      text-align: center;
    }

    /* APP */
    #app {
      height: 100%;
      display: flex;
    }

    .rail {
      width: 76px;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 8px;
      overflow-y: auto;
    }

    .rail-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .rail-section-label {
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: .1em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin: 2px 0;
    }

    .rail-divider {
      width: 36px;
      height: 2px;
      background: var(--line);
      margin: 14px 0;
      border-radius: 2px;
    }

    .rail-item {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-family: var(--font-display);
      font-weight: 700;
      border: 2px solid transparent;
      position: relative;
      transition: border-radius .15s;
      font-size: 16px;
      text-align: center;
      line-height: 1.1;
      flex-shrink: 0;
    }

    .rail-item:hover,
    .rail-item.active {
      border-radius: 14px;
      color: var(--signal);
    }

    .rail-item.type-channels {
      border-color: var(--signal-dim);
    }

    .rail-item.type-mp {
      border-radius: 50%;
      border-color: var(--alert-dim);
    }

    .rail-item.type-mp:hover,
    .rail-item.type-mp.active {
      border-radius: 38%;
    }

    .rail-item.active {
      border-color: var(--signal);
    }

    .rail-item .status {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
      border: 2px solid var(--bg);
    }

    .rail-item .status.on {
      background: var(--signal);
    }

    .rail-item .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--alert);
      color: #fff;
      font-size: 9px;
      font-family: var(--font-mono);
      border-radius: 20px;
      padding: 1px 5px;
      min-width: 14px;
      text-align: center;
    }

    .rail-item.unreachable {
      opacity: .4;
      cursor: pointer;
    }

    .rail-item.unreachable:hover {
      border-radius: 16px;
      color: var(--text-dim);
    }

    .rail-item.unreachable.type-mp:hover {
      border-radius: 50%;
    }

    .rail-item.add {
      color: var(--signal);
      font-size: 18px;
      border: 1px dashed var(--line);
    }

    .rail-item.add.mp-add {
      border-radius: 50%;
      color: var(--alert);
      border-color: var(--alert-dim);
    }

    .rail-item.refresh-btn {
      color: var(--text-dim);
      font-size: 19px;
      border: 1px solid var(--line);
    }

    .rail-item.refresh-btn:hover {
      color: var(--signal);
      border-color: var(--signal-dim);
    }

    .rail-item.refresh-btn.spinning {
      animation: spin .7s linear;
    }

    .rail-item.explore {
      background: linear-gradient(135deg, rgba(79, 224, 196, 0.16), rgba(79, 224, 196, 0.05));
      border: 1px solid rgba(79, 224, 196, 0.35);
      color: var(--signal);
      font-size: 20px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .rail-item.explore:hover {
      background: linear-gradient(135deg, rgba(79, 224, 196, 0.3), rgba(79, 224, 196, 0.15));
      border-color: var(--signal);
      border-radius: 16px;
      transform: scale(1.06);
      box-shadow: 0 4px 14px rgba(79, 224, 196, 0.25);
    }

    /* Modal Annuaire Central */
    .dir-modal-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dir-source-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg-raised);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .dir-source-bar label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .dir-source-select {
      flex: 1;
      min-width: 180px;
      padding: 7px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }

    .dir-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dir-search-wrap {
      flex: 1;
      min-width: 200px;
    }

    .dir-search-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 13.5px;
    }

    .dir-chips {
      display: flex;
      gap: 6px;
    }

    .dir-chip {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .dir-chip.active, .dir-chip:hover {
      background: var(--signal-dim);
      color: var(--signal);
      border-color: var(--signal);
    }

    .dir-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      max-height: 48vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .dir-card {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.18s ease;
    }

    .dir-card:hover {
      border-color: rgba(79, 224, 196, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .dir-card-head {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dir-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(79, 224, 196, 0.12);
      border: 1px solid rgba(79, 224, 196, 0.3);
      color: var(--signal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .dir-card-icon.mp {
      border-radius: 50%;
      background: rgba(255, 122, 69, 0.12);
      border-color: rgba(255, 122, 69, 0.3);
      color: var(--alert);
    }

    .dir-card-icon.both {
      background: linear-gradient(135deg, rgba(79, 224, 196, 0.15), rgba(255, 122, 69, 0.15));
      border-color: rgba(79, 224, 196, 0.4);
      color: #fff;
    }

    .dir-card-info {
      flex: 1;
      min-width: 0;
    }

    .dir-card-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dir-card-host {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dir-card-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 32px;
    }

    .dir-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .dir-card-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
    }

    .dir-tag {
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .dir-tag.channels {
      background: rgba(79, 224, 196, 0.12);
      color: var(--signal);
    }

    .dir-tag.mp {
      background: rgba(255, 122, 69, 0.12);
      color: var(--alert);
    }

    .dir-tag.both {
      background: rgba(180, 130, 255, 0.15);
      color: #c49eff;
    }

    .dir-empty {
      padding: 32px 18px;
      text-align: center;
      color: var(--text-dim);
      grid-column: 1 / -1;
      font-size: 13.5px;
      background: var(--bg-raised);
      border-radius: 8px;
      border: 1px dashed var(--line);
    }

    .rail-mobile-footer {
      display: none;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sidebar {
      width: 250px;
      background: var(--bg-raised);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head .head-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-head h2 {
      font-family: var(--font-display);
      font-size: 16px;
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-head .icon-edit {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
    }

    .sidebar-head .fp {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      word-break: break-all;
      margin-top: 4px;
    }

    .sidebar-head .role-badge {
      display: inline-block;
      font-size: 9px;
      font-family: var(--font-mono);
      padding: 2px 7px;
      border-radius: 20px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .role-badge.owner {
      background: rgba(255, 122, 69, .15);
      color: var(--alert);
    }

    .role-badge.admin {
      background: var(--signal-dim);
      color: var(--signal);
    }

    .role-badge.member {
      background: var(--bg-panel);
      color: var(--text-dim);
    }

    .channels {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .channel-group-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 8px 6px;
    }

    .channel-group-label button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      padding: 0 4px;
    }

    .channel-group-label button:hover {
      color: var(--signal);
    }

    .mp-find-friends-btn {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 10px;
      margin: 6px 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .mp-find-friends-btn:hover {
      border-color: var(--signal);
      color: var(--signal);
    }

    .mp-find-friends-btn.active {
      border-color: var(--signal);
      background: var(--signal-dim);
      color: var(--signal);
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 2px;
    }

    .channel:hover {
      background: var(--bg-panel);
      color: var(--text);
    }

    .channel.active {
      background: var(--bg-panel);
      color: var(--signal);
    }

    .channel .del {
      margin-left: auto;
      opacity: 0;
      font-size: 11px;
    }

    .channel:hover .del {
      opacity: 1;
    }

    .add-channel-row {
      display: flex;
      gap: 4px;
      padding: 4px 4px 10px;
    }

    .add-channel-row input {
      flex: 1;
      padding: 6px 8px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
    }

    .add-channel-row button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: var(--signal-dim);
      color: var(--signal);
      font-size: 12px;
    }

    .avatar-img {
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      padding: 5px 10px;
      border-radius: 6px;
      position: relative;
    }

    .member-row:hover {
      background: var(--bg-panel);
      color: var(--text);
    }

    .member-row .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal);
      flex-shrink: 0;
    }

    .member-row .role-tag {
      font-size: 9px;
      color: var(--alert);
      font-family: var(--font-mono);
      margin-left: 2px;
    }

    .member-row .menu-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      opacity: 0;
      padding: 2px 6px;
    }

    .member-row:hover .menu-btn {
      opacity: 1;
    }

    .member-row input[type=checkbox] {
      margin-right: 2px;
    }

    .member-menu {
      position: absolute;
      right: 6px;
      top: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      z-index: 20;
      min-width: 150px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
    }

    .member-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text);
      padding: 7px 10px;
      font-size: 12.5px;
      border-radius: 6px;
    }

    .member-menu button:hover {
      background: var(--bg-raised);
    }

    .member-menu button.danger {
      color: var(--danger);
    }

    .voice-section {
      padding: 8px;
      border-top: 1px solid var(--line);
    }

    .voice-join-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--signal-dim);
      background: transparent;
      color: var(--signal);
      font-size: 13px;
      font-weight: 600;
    }

    .voice-join-btn.active {
      background: var(--signal-dim);
    }

    .voice-member {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      padding: 5px 10px;
    }

    .dm-call-stage {
      margin: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 220px;
      background: linear-gradient(145deg, var(--bg-raised), var(--bg-panel));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    .dm-call-stage .call-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--signal-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--signal);
      overflow: hidden;
    }

    .dm-call-stage .call-avatar .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dm-call-stage h2 {
      margin: 0;
      font-size: 20px;
    }

    .dm-call-stage p {
      margin: 0;
      color: var(--text-dim);
      font-size: 13px;
    }

    .dm-call-stage button {
      margin-top: 5px;
      background: var(--danger);
      color: white;
      border: 0;
      border-radius: 22px;
      padding: 10px 18px;
      font-weight: 700;
    }

    .user-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-footer .avatar-wrap {
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .user-footer .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--signal-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--signal);
    }

    .user-footer .who {
      flex: 1;
      font-size: 13px;
      min-width: 0;
    }

    .user-footer .who small {
      display: block;
      color: var(--text-dim);
      font-size: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      padding: 4px;
    }

    .icon-btn:hover {
      color: var(--signal);
    }

    .icon-btn.on {
      color: var(--signal);
    }

    .icon-btn.muted {
      color: var(--danger);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 52px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      background: var(--bg-raised);
    }

    .topbar h3 {
      font-family: var(--font-display);
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }

    .topbar .lock {
      font-size: 11px;
      color: var(--signal);
      font-family: var(--font-mono);
      border: 1px solid var(--signal-dim);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .topbar .spacer {
      flex: 1;
    }

    .call-controls {
      display: flex;
      gap: 6px;
    }

    .screen-grid {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .screen-tile {
      width: 220px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .screen-tile video {
      width: 100%;
      display: block;
    }

    .screen-tile .label {
      font-size: 10px;
      color: var(--text-dim);
      padding: 4px 8px;
      font-family: var(--font-mono);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg {
      display: flex;
      gap: 12px;
      padding: 6px 4px;
      border-radius: 6px;
    }

    .msg:hover {
      background: var(--bg-panel);
    }

    .msg.mentioned {
      background: rgba(255, 122, 69, .08);
      border-left: 2px solid var(--alert);
    }

    .msg .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--signal);
    }

    .msg .content {
      flex: 1;
      min-width: 0;
    }

    .msg .head {
      font-size: 13px;
      margin-bottom: 2px;
    }

    .msg .head b {
      font-weight: 700;
    }

    .msg .head span {
      color: var(--text-dim);
      font-size: 10px;
      margin-left: 8px;
      font-family: var(--font-mono);
    }

    .msg .body {
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .msg .body .mention {
      background: var(--signal-dim);
      color: var(--signal);
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 600;
    }

    .msg .body .mention.everyone {
      background: rgba(255, 122, 69, .18);
      color: var(--alert);
    }

    .msg .body b,
    .msg .body strong {
      font-weight: 700;
      color: var(--text-bright);
    }

    .msg .body u {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .msg .body s {
      text-decoration: line-through;
      opacity: 0.75;
    }

    .msg .body em {
      font-style: italic;
    }

    .msg .body code {
      background: rgba(255, 255, 255, .08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    .msg.system {
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 4px 4px;
    }

    .msg.locked {
      color: var(--text-dim);
      font-size: 12px;
      font-style: italic;
      font-family: var(--font-mono);
      padding: 4px 4px;
    }

    .composer {
      padding: 12px 20px 18px;
    }

    .composer-inner {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 4px 6px;
      gap: 2px;
    }

    .composer-inner input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
    }

    .composer-inner button.send {
      background: var(--signal);
      border: none;
      color: #04211c;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 13px;
    }

    .composer-inner button.attach {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 17px;
      padding: 6px 8px;
    }

    .composer-inner button.attach:hover {
      color: var(--signal);
    }

    .composer-hint {
      font-size: 10.5px;
      color: var(--text-dim);
      padding: 4px 6px 0;
      font-family: var(--font-mono);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .char-counter {
      flex-shrink: 0;
    }

    .char-counter.warn {
      color: var(--alert);
    }

    .char-counter.max {
      color: var(--danger);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 14px;
      text-align: center;
      padding: 40px;
    }

    .empty-state h2 {
      font-family: var(--font-display);
      color: var(--text);
      font-size: 20px;
      margin: 0;
    }

    .empty-state p {
      max-width: 440px;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }

    /* MP panel */
    .mp-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .mp-search {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mp-search input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
    }

    .mp-search button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: var(--signal);
      color: #04211c;
      font-weight: 700;
    }

    .mp-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .mp-toolbar button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--alert-dim);
      background: transparent;
      color: var(--alert);
      font-size: 12.5px;
      font-weight: 600;
    }

    .mp-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      margin: 22px 0 10px;
    }

    .mp-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--bg-panel);
    }

    .mp-row .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      color: var(--signal);
      flex-shrink: 0;
    }

    .mp-row .info {
      flex: 1;
      min-width: 0;
    }

    .mp-row .info .name {
      font-size: 14px;
    }

    .mp-row .info .sub {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .mp-row .actions {
      display: flex;
      gap: 6px;
    }

    .mp-row .actions button {
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--text);
      font-size: 12px;
    }

    .mp-row .actions button.primary {
      background: var(--signal);
      color: #04211c;
      border: none;
      font-weight: 700;
    }

    .mp-row .actions button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .mp-empty {
      color: var(--text-dim);
      font-size: 12.5px;
      font-style: italic;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, .7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(3px);
    }

    .modal {
      width: 460px;
      max-width: 92vw;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 26px;
      max-height: 86vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-family: var(--font-display);
      margin: 0 0 6px;
      font-size: 18px;
    }

    .modal .sub {
      color: var(--text-dim);
      font-size: 12.5px;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .modal .step {
      margin-bottom: 16px;
    }

    .modal .step label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      justify-content: flex-end;
    }

    .btn-sm {
      padding: 9px 16px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--text);
      font-size: 13px;
    }

    .btn-sm.primary {
      background: var(--signal);
      color: #04211c;
      border: none;
      font-weight: 700;
    }

    .status-line {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .status-line.ok {
      color: var(--signal);
    }

    .status-line.err {
      color: var(--danger);
    }

    .server-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .server-row small {
      display: block;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 14px;
      border: 2px solid var(--signal-dim);
    }

    /* ---- ajouts : badges, vocal amélioré, appels, profils, blocage, messages ---- */
    .channel .unread-badge,
    .mp-row .unread-badge,
    .rail-item .badge {
      background: var(--alert);
      color: #fff;
      font-size: 9px;
      font-family: var(--font-mono);
      border-radius: 20px;
      padding: 1px 6px;
      min-width: 14px;
      text-align: center;
      font-weight: 700;
    }

    .channel .unread-badge {
      margin-left: auto;
    }

    .channel.voice-channel {
      cursor: pointer;
    }

    .channel.voice-channel.active {
      color: var(--signal);
    }

    .voice-channel-members {
      padding: 2px 0 6px 26px;
    }

    .voice-channel-member {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-dim);
      padding: 3px 0;
    }

    .voice-channel-member.speaking {
      color: var(--signal);
      font-weight: 600;
    }

    .voice-channel-member .mic-state {
      font-size: 10px;
    }

    .mention-chip,
    .mention.everyone,
    .mention {
      cursor: pointer;
    }

    .msg .avatar {
      cursor: pointer;
    }

    .msg:hover .msg-actions {
      opacity: 1;
    }

    .msg-actions {
      position: absolute;
      top: -10px;
      right: 8px;
      opacity: 0;
      display: flex;
      gap: 2px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px;
    }

    .msg {
      position: relative;
    }

    .msg-actions button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .msg-actions button:hover {
      color: var(--signal);
      background: var(--bg-raised);
    }

    .msg-actions button.danger:hover {
      color: var(--danger);
    }

    .msg .edited-tag {
      font-size: 9px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-left: 5px;
    }

    .msg-ticks {
      font-size: 10px;
      margin-left: 6px;
      letter-spacing: -1px;
      color: var(--text-dim);
    }

    .msg-ticks.delivered {
      color: var(--text-dim);
      letter-spacing: 0;
    }

    .msg-ticks.read {
      color: var(--signal);
      letter-spacing: 0;
    }

    .msg-ticks.pending {
      color: var(--text-dim);
      letter-spacing: 0;
      animation: pulseTick 1.2s infinite;
    }

    .msg-ticks.failed {
      color: var(--danger);
      letter-spacing: 0;
      font-weight: 600;
    }

    @keyframes pulseTick {

      0%,
      100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }
    }

    .msg.pending {
      opacity: .55;
    }

    .msg.pending .msg-actions {
      display: none;
    }

    .msg.failed {
      opacity: .55;
    }

    .msg.failed .body {
      text-decoration: line-through;
      text-decoration-color: var(--danger);
      text-decoration-thickness: 1px;
    }

    .msg.failed .msg-actions {
      opacity: 1;
      position: static;
      background: none;
      border: none;
      padding: 4px 0 0;
    }

    .msg.failed .msg-actions button {
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .msg.deleted .body {
      color: var(--text-dim);
      font-style: italic;
    }

    .msg-edit-box {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .msg-edit-box input {
      flex: 1;
      padding: 6px 8px;
      background: var(--bg-raised);
      border: 1px solid var(--signal-dim);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }

    .msg-edit-box button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: var(--signal-dim);
      color: var(--signal);
      font-size: 12px;
    }

    /* ================= FUSION WHATSAPP & DISCORD — RÉPONSES & RÉACTIONS ================= */
    .msg-reply-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11.5px;
      color: var(--text-dim);
      cursor: pointer;
      position: relative;
      padding: 2px 8px 2px 22px;
      border-radius: 6px;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--signal);
      transition: all 0.15s ease;
      user-select: none;
    }

    .msg-reply-bar:hover {
      color: var(--text);
      background: rgba(79, 224, 196, 0.08);
      border-left-color: #fff;
    }

    .msg-reply-bar .reply-spine-curve {
      position: absolute;
      left: 6px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-left: 2px solid var(--text-dim);
      border-bottom: 2px solid var(--text-dim);
      border-bottom-left-radius: 4px;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    .msg-reply-bar .reply-author {
      font-weight: 700;
      color: var(--signal);
      letter-spacing: -0.01em;
    }

    .msg-reply-bar .reply-snippet {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-dim);
      font-size: 11px;
    }

    @keyframes msgHighlightPulse {
      0% {
        background: rgba(79, 224, 196, 0.35);
        box-shadow: 0 0 20px rgba(79, 224, 196, 0.35);
      }
      40% {
        background: rgba(79, 224, 196, 0.22);
      }
      100% {
        background: transparent;
        box-shadow: none;
      }
    }

    .msg.msg-highlight-pulse {
      animation: msgHighlightPulse 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border-radius: 6px;
    }

    /* Composer Reply Preview (style WhatsApp & Discord) */
    .composer-reply-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      padding: 8px 12px;
      position: relative;
      margin-bottom: -1px;
      overflow: hidden;
      animation: replyBarSlideIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .composer-reply-bar.hidden {
      display: none !important;
    }

    .composer-reply-bar:not(.hidden) + .composer-inner {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    @keyframes replyBarSlideIn {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .composer-reply-bar .reply-bar-accent {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--signal);
    }

    .composer-reply-bar .reply-bar-body {
      flex: 1;
      min-width: 0;
      padding-left: 6px;
    }

    .composer-reply-bar .reply-bar-header {
      font-size: 11.5px;
      color: var(--signal);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }

    .composer-reply-bar .reply-bar-icon {
      font-size: 12px;
    }

    .composer-reply-bar .reply-bar-snippet {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-reply-bar .reply-bar-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .composer-reply-bar .reply-bar-close:hover {
      color: var(--danger);
      background: rgba(255, 77, 79, 0.15);
    }

    /* Message Reactions Container (style Discord pills sous le message) */
    .msg-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
      align-items: center;
    }

    .reaction-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .reaction-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      color: var(--text);
      transform: scale(1.05);
    }

    .reaction-pill.active {
      background: rgba(79, 224, 196, 0.15);
      border-color: rgba(79, 224, 196, 0.45);
      color: var(--signal);
      font-weight: 600;
      box-shadow: 0 0 8px rgba(79, 224, 196, 0.12);
    }

    .reaction-pill .reaction-count {
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .reaction-pill.reaction-add-btn {
      padding: 2px 7px;
      opacity: 0.65;
      font-size: 11px;
    }

    .reaction-pill.reaction-add-btn:hover {
      opacity: 1;
      border-color: var(--signal);
      color: var(--signal);
    }

    .reaction-pill.reaction-add-btn .reaction-add-plus {
      font-size: 10px;
      margin-right: 2px;
    }

    /* Floating Reaction Picker Popover (WhatsApp / Discord fusion) */
    .reaction-picker-popover {
      position: fixed;
      z-index: 10000;
      background: #131822;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
      border-radius: 30px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      backdrop-filter: blur(12px);
      animation: popoverScaleIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popoverScaleIn {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .reaction-picker-popover button.emoji-quick-btn {
      background: none;
      border: none;
      font-size: 20px;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 50%;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.12s;
    }

    .reaction-picker-popover button.emoji-quick-btn:hover {
      transform: scale(1.35) translateY(-3px);
      background: rgba(255, 255, 255, 0.1);
    }

    .reaction-picker-popover .more-emojis-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 3px;
      transition: all 0.15s ease;
    }

    .reaction-picker-popover .more-emojis-btn:hover {
      background: var(--signal);
      color: #04211c;
      transform: scale(1.1);
    }

    .emoji-grid-panel {
      position: fixed;
      z-index: 10001;
      background: #131822;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      backdrop-filter: blur(12px);
      animation: popoverScaleIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .emoji-grid-panel button {
      background: none;
      border: none;
      font-size: 22px;
      padding: 6px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.12s, transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .emoji-grid-panel button:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.22);
    }

    .floating-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1b2230;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 10050;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .floating-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* appel entrant */
    .call-banner-stack {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incoming-call-banner {
      background: var(--bg-panel);
      border: 1px solid var(--signal-dim);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      animation: pulseCall 1.4s infinite;
    }

    @keyframes pulseCall {

      0%,
      100% {
        border-color: var(--signal-dim);
      }

      50% {
        border-color: var(--signal);
      }
    }

    .incoming-call-banner .call-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--signal-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--signal);
      font-weight: 700;
      overflow: hidden;
    }

    .incoming-call-banner .info {
      font-size: 13px;
    }

    .incoming-call-banner .info small {
      display: block;
      color: var(--text-dim);
      font-size: 11px;
    }

    .incoming-call-banner .actions {
      display: flex;
      gap: 6px;
    }

    .incoming-call-banner button {
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 15px;
    }

    .incoming-call-banner button.accept {
      background: var(--signal);
      color: #04211c;
    }

    .incoming-call-banner button.decline {
      background: var(--danger);
      color: #fff;
    }

    .dm-call-stage .ringing-dots span {
      animation: blink 1.2s infinite;
    }

    .dm-call-stage .ringing-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dm-call-stage .ringing-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }

    /* grille vocale façon discord */
    .voice-stage {
      padding: 14px 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
    }

    .voice-tiles {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .voice-tile {
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 6px;
      border-radius: 10px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
    }

    .voice-tile.speaking {
      border-color: var(--signal);
    }

    .voice-tile.speaking .v-avatar {
      box-shadow: 0 0 0 3px var(--signal), 0 0 14px rgba(79, 224, 196, .55);
    }

    .dm-call-stage .call-avatar {
      transition: box-shadow .15s ease;
    }

    .dm-call-stage .call-avatar.speaking {
      box-shadow: 0 0 0 4px var(--signal), 0 0 22px rgba(79, 224, 196, .55);
      border-radius: 50%;
    }

    .voice-tile .v-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--signal-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--signal);
      font-weight: 700;
      overflow: hidden;
      position: relative;
      transition: box-shadow .15s ease;
    }

    .voice-tile .v-name {
      font-size: 11.5px;
      text-align: center;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .voice-tile .v-mute {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--danger);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      border: 2px solid var(--bg-raised);
    }

    /* menu profil utilisateur */
    .profile-card {
      width: 100%;
    }

    .profile-card .p-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background: var(--signal-dim);
      color: var(--signal);
      font-size: 22px;
      font-weight: 700;
    }

    .profile-card h3 {
      text-align: center;
    }

    .profile-card .p-fp {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 10px;
      word-break: break-all;
    }

    .profile-card .p-bio {
      font-size: 13px;
      color: var(--text);
      background: var(--bg-raised);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .profile-card .p-servers {
      margin-bottom: 14px;
    }

    .profile-card .p-servers .srv-chip {
      display: inline-block;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      margin: 0 6px 6px 0;
      color: var(--text-dim);
    }

    .profile-card .p-mp-targets button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--text);
      font-size: 13px;
    }

    .profile-card .p-mp-targets button:hover {
      border-color: var(--signal);
      color: var(--signal);
    }

    .profile-card .p-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .avatar-settings-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .avatar-settings-preview {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-settings-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .avatar-settings-btns .btn-sm {
      margin: 0;
    }

    .settings-row small {
      display: block;
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 2px;
    }

    .toggle-switch {
      width: 38px;
      height: 22px;
      border-radius: 20px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-switch.on {
      background: var(--signal-dim);
      border-color: var(--signal);
    }

    .toggle-switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: left .15s;
    }

    .toggle-switch.on .knob {
      left: 18px;
      background: var(--signal);
    }

    textarea.bio-input {
      width: 100%;
      padding: 10px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
      resize: vertical;
      min-height: 70px;
    }

    .mobile-back {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      padding: 2px 8px 2px 0;
      margin-right: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ============================================================
   RESPONSIVE / MOBILE
   En dessous du seuil, on passe d'un layout 3 colonnes (rail + sidebar + main)
   à une navigation à un seul panneau à la fois (comme les apps de chat mobiles) :
   #app.mstate-rail / .mstate-sidebar / .mstate-main contrôle lequel est affiché.
   Au-dessus du seuil, ces classes n'ont aucun effet (layout desktop normal).
   ============================================================ */
    @media (max-width: 860px) {

      html,
      body {
        overflow: hidden;
      }

      #app {
        position: relative;
        overflow: hidden;
      }

      .rail,
      .sidebar,
      .main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 1;
      }

      #app.mstate-rail .rail {
        display: flex;
        z-index: 3;
      }

      #app.mstate-sidebar .sidebar {
        display: flex;
        z-index: 3;
      }

      #app.mstate-main .main {
        display: flex;
        z-index: 3;
      }

      /* rail plein écran : icônes de serveurs en grille centrée plutôt qu'en fine colonne */
      .rail {
        flex-direction: column;
        padding: 14px 14px;
        overflow-y: auto;
        align-items: center;
      }

      .rail-section {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        align-items: center;
      }

      .rail-item {
        width: 56px;
        height: 56px;
        font-size: 15px;
      }

      .rail-section-label {
        width: 100%;
        text-align: center;
        padding: 4px 4px;
      }

      /* accès aux paramètres du compte + rappel d'ajouter des serveurs, en bas de l'écran serveurs */
      .rail-mobile-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-top: auto;
        padding-top: 24px;
        text-align: center;
      }

      .rail-mobile-settings {
        padding: 10px 18px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--bg-panel);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }

      .rail-mobile-settings:hover {
        border-color: var(--signal);
        color: var(--signal);
      }

      .rail-mobile-hint {
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.5;
        max-width: 280px;
        margin: 0;
      }

      .sidebar,
      .main {
        width: 100%;
      }

      .mobile-back {
        display: inline-block;
      }

      /* cibles tactiles plus grandes */
      .channel,
      .member-row,
      .voice-channel-member {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .rail-item.add {
        width: 56px;
        height: 56px;
      }

      /* la grille de couleurs du thème passe sur 1 colonne, plus lisible au doigt */
      #themeColorGrid {
        grid-template-columns: 1fr auto !important;
      }

      .modal {
        width: 92vw !important;
        max-width: 440px;
        max-height: 85vh;
        overflow-y: auto;
      }

      .voice-tile {
        width: 100px;
      }

      .call-controls {
        gap: 2px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      .incoming-call-banner {
        left: 12px;
        right: 12px;
        top: 12px;
      }

      .call-banner-stack {
        left: 12px;
        right: 12px;
        top: 12px;
      }

      .call-banner-stack .incoming-call-banner {
        width: auto;
      }

      .composer-inner input {
        font-size: 16px;
      }

      /* évite le zoom auto de Safari iOS sur les champs texte */
      #chatInput {
        font-size: 16px;
      }
    }

    /* petits téléphones : encore un cran plus compact */
    @media (max-width: 380px) {
      .rail-item {
        width: 50px;
        height: 50px;
        font-size: 13px;
      }

      .msg .avatar {
        width: 28px;
        height: 28px;
      }

      .auth-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div id="auth" class="hidden">
    <div class="auth-card">
      <p class="auth-eyebrow">identité locale · chiffrée</p>
      <div class="auth-tabs">
        <button class="auth-tab" id="tabLogin">Se connecter</button>
        <button class="auth-tab" id="tabRegister">Créer un compte</button>
      </div>
      <button class="btn-ghost hidden" id="authShowExisting" style="margin:0 0 14px;">◉ Voir les comptes enregistrés
        sur cet appareil</button>
      <div class="auth-existing-list hidden" id="authExistingList"></div>
      <div class="field"><label>Pseudo</label><input id="authUser" type="text" placeholder="ex: renard_furtif"
          autocomplete="off"></div>
      <div class="field"><label>Mot de passe</label>
        <div class="password-wrap">
          <input id="authPass" type="password" placeholder="••••••••••">
          <button type="button" class="toggle-password-btn" data-for="authPass" title="Afficher le mot de passe"
            tabindex="-1">◉</button>
        </div>
      </div>
      <label class="remember-row"><input type="checkbox" id="authRemember" checked> Rester connecté sur cet
        appareil</label>
      <button class="btn-primary" id="authSubmit">Se connecter</button>
